    <div class="dest-length-row">
      <div class="dest-len-btn ${destLength==='full'?'active':''}" data-l="full" ${s.running?'style="pointer-events:none;opacity:.5;"':''}>Full passage (~400 words)</div>
      <div class="dest-len-btn ${destLength==='short'?'active':''}" data-l="short" ${s.running?'style="pointer-events:none;opacity:.5;"':''}>Short passage (~190 words)</div>
    </div>
    <div class="dest-info-row">
      <div class="dest-stat"><div class="n" id="destTimer">${mins}:${secs}</div><div class="l">${timerLabel}</div></div>
      <div class="dest-stat"><div class="n" id="destKeys">${s.keydowns}</div><div class="l">Key Depressions</div></div>
      <div class="dest-stat"><div class="n" id="destKdph">0</div><div class="l">Live KDPH</div></div>
      <div class="dest-stat"><div class="n" id="destAcc">100%</div><div class="l">Accuracy</div></div>
    </div>
    <div class="dest-passage" id="destPassage"></div>
    <textarea class="dest-input" id="destInput" placeholder="Click Start, then type the passage above exactly as shown…" ${s.running?'':'disabled'} spellcheck="false" autocomplete="off"></textarea>
    <div id="destPasteWarn" style="display:none; color:#f87171; font-size:11px; font-family:var(--mono); margin-top:6px;">⚠ Pasting is disabled — just like the real exam, you have to actually type it.</div>
    <div class="dest-controls">
      <button class="dest-btn start" id="destStartBtn" ${s.running?'disabled':''}>${s.finished?'↻ New Passage, Try Again':'▶ Start Test'}</button>
      <button class="dest-btn submit" id="destSubmitBtn" ${s.running?'':'disabled'}>■ Submit Now</button>
    </div>
    <div class="dest-note">Real DEST format (Exam Mode): English passage, 15 minutes, target 8,000 key depressions/hour (≈2,000 in 15 min). Every keystroke — letters, spaces, punctuation, backspace — counts as one key depression, same as the real exam. Practice Mode removes the clock pressure so you can focus on accuracy first. Always confirm exact rules on your official SSC admit card.</div>
    <div id="destResultWrap"></div>
  `;
  paintPassageHighlight("");
  document.getElementById("destStartBtn").addEventListener("click", startTyping);
  document.getElementById("destSubmitBtn").addEventListener("click", ()=>finishTyping(false));
  winBody.querySelectorAll(".dest-mode-btn").forEach(el=>{
    el.addEventListener("click", ()=>{ if(s.running) return; destMode = el.dataset.m; renderTyping(); });
  });
  winBody.querySelectorAll(".dest-len-btn").forEach(el=>{
    el.addEventListener("click", ()=>{ if(s.running) return; destLength = el.dataset.l; renderTyping(); });
  });
}
function paintPassageHighlight(typed){
  const s = destState;
  const p = s.passage;
  let html = "";
  for(let i=0;i<p.length;i++){
    const ch = p[i]==="\n" ? "↵\n" : p[i];
    if(i < typed.length){
      html += `<span class="${typed[i]===p[i] ? 'correct':'wrong'}">${escapeHtml(ch)}</span>`;
    } else if(i === typed.length){
      html += `<span class="current">${escapeHtml(ch)}</span>`;
    } else {
      html += `<span class="pending">${escapeHtml(ch)}</span>`;
    }
  }
  const el = document.getElementById("destPassage");
  if(el) el.innerHTML = html;
}
function escapeHtml(s){ return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

function startTyping(){
  const s = destState;
  s.running = true;
  s.finished = false;
  s.keydowns = 0;
  s.remaining = destMode==="exam" ? CONTENT.typing.durationSec : 0;
  s.startTime = null;
  paintTyping();
  const input = document.getElementById("destInput");
  input.disabled = false;
  input.focus();
  input.addEventListener("keydown", onDestKeydown);
  input.addEventListener("input", onDestInput);
  input.addEventListener("paste", onDestPaste);
}
function onDestPaste(e){
  e.preventDefault();
  const warn = document.getElementById("destPasteWarn");
  if(warn){ warn.style.display="block"; setTimeout(()=>{ if(warn) warn.style.display="none"; }, 2500); }
}
function onDestKeydown(){
  const s = destState;
  if(!s.running) return;
  if(s.startTime === null){
    s.startTime = Date.now();
    s.timerId = setInterval(tickTyping, 1000);
  }
  s.keydowns++;
}
function onDestInput(e){
  const s = destState;
  if(!s.running) return;
  const typed = e.target.value;
  paintPassageHighlight(typed);
  updateLiveStats(typed);
  if(typed.length >= s.passage.length){
    finishTyping(true);
  }
}
function updateLiveStats(typed){
  const s = destState;
  let correct = 0;
  for(let i=0;i<typed.length;i++){ if(typed[i]===s.passage[i]) correct++; }
  const acc = typed.length ? Math.round((correct/typed.length)*100) : 100;
  const elapsedMin = s.startTime ? Math.max((Date.now()-s.startTime)/60000, 0.01) : 0.01;
  const kdph = Math.round(s.keydowns / elapsedMin * 60);
  const keysEl = document.getElementById("destKeys");
  const kdphEl = document.getElementById("destKdph");
  const accEl = document.getElementById("destAcc");
  if(keysEl) keysEl.textContent = s.keydowns;
  if(kdphEl) kdphEl.textContent = kdph;
  if(accEl) accEl.textContent = acc + "%";
}
function tickTyping(){
  const s = destState;
  if(destMode === "exam"){
    s.remaining--;
  } else {
    s.remaining++;
  }
  const mins = String(Math.floor(s.remaining/60)).padStart(2,"0");
  const secs = String(s.remaining%60).padStart(2,"0");
  const t = document.getElementById("destTimer");
  if(t) t.textContent = `${mins}:${secs}`;
  const input = document.getElementById("destInput");
  if(input) updateLiveStats(input.value);
  if(destMode === "exam" && s.remaining <= 0) finishTyping(true);
}
function finishTyping(natural){
  const s = destState;
  if(!s.running) return;
  s.running = false;
  s.finished = true;
  if(s.timerId){ clearInterval(s.timerId); s.timerId = null; }
  const input = document.getElementById("destInput");
  const typed = input ? input.value : "";
  let correct = 0;
  for(let i=0;i<typed.length;i++){ if(typed[i]===s.passage[i]) correct++; }
  const accuracy = typed.length ? Math.round((correct/typed.length)*100) : 0;
  const elapsedSec = s.startTime ? (Date.now()-s.startTime)/1000 : (destMode==="exam" ? CONTENT.typing.durationSec - s.remaining : s.remaining);
  const elapsedMin = Math.max(elapsedSec/60, 0.1);
  const kdph = Math.round(s.keydowns / elapsedMin * 60);
  const wpm = Math.round((correct/5) / elapsedMin);
  const pass = kdph >= CONTENT.typing.targetKDPH;
  if(input){
    input.disabled = true;
    input.removeEventListener("keydown", onDestKeydown);
    input.removeEventListener("input", onDestInput);
    input.removeEventListener("paste", onDestPaste);
  }
  document.getElementById("destStartBtn").disabled = false;
  document.getElementById("destStartBtn").textContent = "↻ New Passage, Try Again";
  document.getElementById("destSubmitBtn").disabled = true;
  const modeNote = destMode === "practice" ? `<div class="verdict-sub" style="margin-top:4px;">Practice Mode — pass/fail shown for reference; the real exam is Exam Mode only.</div>` : "";
  document.getElementById("destResultWrap").innerHTML = `
    <div class="dest-result ${pass?'pass':'fail'} content-fade">
      <div class="verdict">${pass ? '✓ Qualifying pace reached' : '✗ Below qualifying pace'}</div>
      <div class="verdict-sub">${s.keydowns} key depressions in ${elapsedMin.toFixed(1)} min → ~${kdph} KDPH (need ${CONTENT.typing.targetKDPH}) · ~${wpm} WPM · ${accuracy}% accuracy</div>
      ${modeNote}
    </div>
    <div class="dest-info-row">
      <div class="dest-stat"><div class="n">${s.keydowns}</div><div class="l">Total Keystrokes</div></div>
      <div class="dest-stat"><div class="n">${kdph}</div><div class="l">Final KDPH</div></div>
      <div class="dest-stat"><div class="n">${wpm}</div><div class="l">~WPM</div></div>
      <div class="dest-stat"><div class="n">${accuracy}%</div><div class="l">Accuracy</div></div>
    </div>
  `;
  document.getElementById("destStartBtn").onclick = renderTyping;
}

/* ---------------- taskbar clock ---------------- */
function updateClock(){
  const now = new Date();
  const h = String(now.getHours()).padStart(2,"0");
  const m = String(now.getMinutes()).padStart(2,"0");
  document.getElementById("clockTime").textContent = `${h}:${m}`;
  document.getElementById("clockDate").textContent = now.toLocaleDateString(undefined,{day:"2-digit",month:"short",year:"numeric"});
}
updateClock();
setInterval(updateClock, 15000);

/* ---------------- start menu ---------------- */
const startMenu = document.getElementById("startMenu");
function buildStartMenu(){
  startMenu.innerHTML = APPS.map(a=>`
    <div class="sm-item" data-app="${a.id}">${svgIcon(a.icon, a.color)}<span>${a.title}</span></div>
  `).join("") + `<div class="sm-divider"></div><div style="padding:8px 10px; font-size:10.5px; color:var(--text-faint); font-family:var(--mono);">SSC-OS · Tier 2 Computer Proficiency module<br>20 Qs · 60 marks · qualifying section</div>`;
  startMenu.querySelectorAll(".sm-item").forEach(el=>{
    el.addEventListener("click", ()=>{ openWindow(el.dataset.app); startMenu.classList.remove("show"); });
  });
}
buildStartMenu();
document.getElementById("startBtn").addEventListener("click", (e)=>{
  e.stopPropagation();
  startMenu.classList.toggle("show");
});
document.addEventListener("click", (e)=>{
  if(!e.target.closest("#startMenu") && !e.target.closest("#startBtn")) startMenu.classList.remove("show");
});

/* ---------------- global search ---------------- */
const searchOverlay = document.getElementById("searchOverlay");
const globalSearchInput = document.getElementById("globalSearchInput");
const searchHits = document.getElementById("searchHits");

function allTextOfBlocks(blocks){
  let out = [];
  blocks.forEach(b=>{
    if(b.type==="list") out.push(...b.items);
    if(b.type==="table"){ out.push(b.headers.join(" ")); b.rows.forEach(r=>out.push(r.join(" — "))); }
    if(b.type==="trick") out.push(b.text);
  });
  return out.join(" ");
}
function buildSearchIndex(){
  const idx = [];
  CONTENT.topics.forEach(t=>{
    idx.push({type:"App", title:t.title, sub:t.blurb, action:()=>openWindow(t.id)});
    t.subtopics.forEach(s=>{
      const full = allTextOfBlocks(s.blocks);
      idx.push({type:t.title, title:s.title, sub:full.slice(0,90), full, action:()=>{ activeSubtopic[t.id]=s.id; openWindow(t.id); }});
    });
  });
  Object.entries(CONTENT.shortcuts).forEach(([g, rows])=>{
    rows.forEach(([k,d])=>{
      idx.push({type:"Shortcut · "+g, title:k, sub:d, action:()=>{ scActiveGroup=g; openWindow("shortcuts"); }});
    });
  });
  CONTENT.abbr.forEach(([a,f])=>{
    idx.push({type:"Abbreviation", title:a, sub:f, action:()=>openWindow("abbr")});
  });
  Object.entries(CONTENT.flashdecks).forEach(([deckId, deck])=>{
    deck.cards.forEach((c,i)=>{
      idx.push({type:"Flashcard · "+deck.label.replace(/^\S+\s/,""), title:c.front, sub:c.back, action:()=>{ flashDeck=deckId; flashIndex=i; openWindow("flashcards"); }});
    });
  });
  idx.push({type:"App", title:"Practice Quiz", sub:CONTENT.quiz.length+" MCQs across all topics, with difficulty filters", action:()=>openWindow("quiz")});
  idx.push({type:"App", title:"Formula Lab", sub:"Practice writing real Excel formulas with hints", action:()=>openWindow("formulalab")});
  idx.push({type:"App", title:"Typing Test (DEST)", sub:"SSC-format typing speed test — exam or practice mode", action:()=>openWindow("typing")});
  idx.push({type:"App", title:"Notepad", sub:"Scratchpad for this session", action:()=>openWindow("notepad")});
  return idx;
}
const SEARCH_INDEX = buildSearchIndex();

function openSearch(){
  searchOverlay.classList.add("show");
  globalSearchInput.value = "";
  searchHits.innerHTML = "";
  setTimeout(()=>globalSearchInput.focus(), 50);
}
function closeSearch(){ searchOverlay.classList.remove("show"); }
document.getElementById("taskbarSearch").addEventListener("click", openSearch);
searchOverlay.addEventListener("click", (e)=>{ if(e.target === searchOverlay) closeSearch(); });
document.addEventListener("keydown", (e)=>{
  if((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==="k"){ e.preventDefault(); openSearch(); }
  if(e.key === "Escape") closeSearch();
});
globalSearchInput.addEventListener("input", ()=>{
  const q = globalSearchInput.value.trim().toLowerCase();
  if(!q){ searchHits.innerHTML=""; return; }
  const hits = SEARCH_INDEX.filter(h=>
    h.title.toLowerCase().includes(q) ||
    (h.sub&&h.sub.toLowerCase().includes(q)) ||
    (h.full&&h.full.toLowerCase().includes(q))
  ).slice(0,18);
  searchHits.innerHTML = hits.map((h,i)=>`
    <div class="search-hit" data-i="${i}">
      <span class="sh-tag">${h.type}</span>
      <span class="sh-title">${h.title}</span>
      <span class="sh-sub">${(h.sub||"").slice(0,40)}</span>
    </div>`).join("") || `<div class="search-hit"><span class="sh-sub">No matches</span></div>`;
  searchHits.querySelectorAll(".search-hit[data-i]").forEach(el=>{
    el.addEventListener("click", ()=>{
      hits[+el.dataset.i].action();
      closeSearch();
    });
  });
});

})();
</script>

<script>
function closeComputerOSPage() {
  if (window.parent && window.parent !== window) {
    window.parent.postMessage({ type: "closeFullscreen" }, "*");
  } else {
    if (window.history.length > 1) {
      window.history.back();
    } else {
      window.location.href = "../index.html";
    }
  }
}
window.closeComputerOSPage = closeComputerOSPage;

document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") {
    const winLayer = document.getElementById("windowLayer");
    if (!winLayer || !winLayer.classList.contains("show")) {
      closeComputerOSPage();
    }
  }
});
</script>
