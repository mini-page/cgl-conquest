<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SSC-OS — Tier 2 Computer Proficiency</title>
<link rel="icon" type="image/svg+xml" href="../icon.svg?v=2">
<link rel="apple-touch-icon" href="../icon.svg?v=2">
<style>
:root{
  --bg:#0a1420;
  --taskbar:#0d1b2a;
  --window:#0f1c2b;
  --panel:rgba(15,28,43,0.85);
  --line:rgba(148,175,199,0.16);
  --line-strong:rgba(148,175,199,0.3);
  --text:#e7edf3;
  --text-dim:#8ea0b3;
  --text-faint:#546274;
  --accent:#cbd5e1;
  --accent-dim:#64748b;
  --mono: ui-monospace, 'SFMono-Regular', 'JetBrains Mono', Menlo, Consolas, monospace;
  --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, Helvetica, Arial, sans-serif;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{height:100%; margin:0;}
body{
  font-family:var(--sans);
  color:var(--text);
  overflow:hidden;
  height:100vh;
  background:
    radial-gradient(ellipse 1000px 600px at 20% -10%, rgba(56,189,248,0.08), transparent 60%),
    radial-gradient(ellipse 900px 600px at 100% 100%, rgba(167,139,250,0.06), transparent 55%),
    var(--bg);
}
::-webkit-scrollbar{width:8px; height:8px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--line-strong); border-radius:8px;}
::selection{background:rgba(56,189,248,0.35);}

/* ---------------- BOOT SCREEN ---------------- */
#bootScreen{
  position:fixed; inset:0; background:#04080c; z-index:999;
  display:flex; align-items:center; justify-content:center; flex-direction:column;
  font-family:var(--mono); color:#38bdf8;
  transition:opacity .5s ease;
}
#bootScreen .boot-logo{font-size:15px; letter-spacing:4px; margin-bottom:22px; opacity:0.9;}
#bootScreen .boot-bar{width:280px; height:3px; background:rgba(56,189,248,0.15); border-radius:3px; overflow:hidden;}
#bootScreen .boot-bar-fill{height:100%; width:0%; background:#38bdf8; box-shadow:0 0 10px #38bdf8; transition:width 1.4s cubic-bezier(.3,.7,.3,1);}
#bootScreen .boot-lines{margin-top:18px; font-size:10.5px; color:#3a5a70; text-align:left; width:280px; height:70px; overflow:hidden;}
#bootScreen .boot-lines div{opacity:0; animation:bootline .3s forwards;}
@keyframes bootline{to{opacity:1;}}
#bootScreen.hide{opacity:0; pointer-events:none;}

/* ---------------- DESKTOP ---------------- */
#desktop{
  position:absolute; inset:0; bottom:52px;
  padding:26px;
  display:grid;
  grid-template-columns:repeat(auto-fill, 92px);
  grid-auto-rows:96px;
  gap:6px;
  align-content:start;
}
.icon{
  display:flex; flex-direction:column; align-items:center; gap:7px;
  cursor:pointer; padding:8px 4px; border-radius:8px;
  text-align:center; user-select:none;
  transition:background .12s;
}
.icon:hover{background:rgba(255,255,255,0.06);}
.icon:active{background:rgba(56,189,248,0.15);}
.icon .ibox{
  width:42px; height:42px; border-radius:10px;
  display:flex; align-items:center; justify-content:center;
  background:linear-gradient(155deg, rgba(255,255,255,0.08), rgba(255,255,255,0.02));
  border:1px solid var(--line);
}
.icon .ibox svg{width:22px; height:22px;}
.icon span{font-size:10.5px; color:var(--text-dim); line-height:1.25; font-family:var(--sans);}

/* ---------------- TASKBAR ---------------- */
#taskbar{
  position:absolute; left:0; right:0; bottom:0; height:52px;
  background:var(--taskbar);
  border-top:1px solid var(--line);
  display:flex; align-items:center; gap:8px; padding:0 10px;
  z-index:200;
}
#startBtn{
  display:flex; align-items:center; gap:8px;
  background:rgba(56,189,248,0.12); border:1px solid rgba(56,189,248,0.3);
  color:#38bdf8; padding:8px 14px; border-radius:8px; cursor:pointer;
  font-family:var(--mono); font-size:12px; font-weight:700; letter-spacing:0.5px;
  transition:.15s;
}
#startBtn:hover{background:rgba(56,189,248,0.2);}
#startBtn svg{width:15px; height:15px;}

.taskbar-search{
  flex:0 1 320px; display:flex; align-items:center; gap:8px;
  background:rgba(255,255,255,0.04); border:1px solid var(--line); border-radius:8px;
  padding:7px 12px;
}
.taskbar-search input{
  background:transparent; border:none; outline:none; color:var(--text);
  font-size:12.5px; width:100%; font-family:var(--sans);
}
.taskbar-search svg{width:14px; height:14px; color:var(--text-faint); flex-shrink:0;}

#taskApps{display:flex; gap:6px; flex:1;}
.task-app-btn{
  display:flex; align-items:center; gap:7px;
  background:rgba(255,255,255,0.05); border:1px solid var(--line); color:var(--text-dim);
  padding:7px 12px; border-radius:7px; cursor:pointer; font-size:11.5px; font-family:var(--mono);
}
.task-app-btn.active{border-color:var(--accent); color:var(--accent); background:rgba(56,189,248,0.12);}

#clock{font-family:var(--mono); font-size:12px; color:var(--text-dim); text-align:right; padding:0 8px; line-height:1.3; flex-shrink:0;}
#clock .d{font-size:9.5px; color:var(--text-faint);}
</style>
</head>
<style>
/* ---------------- WINDOW ---------------- */
#windowLayer{
  position:absolute; inset:0; bottom:52px;
  display:flex; justify-content:center;
  padding:26px;
  z-index:100;
  opacity:0; visibility:hidden; pointer-events:none;
  transition: opacity .18s ease;
}
#windowLayer.show{opacity:1; visibility:visible; pointer-events:auto;}
.window{
  width:100%; max-width:960px; height:100%;
  background:var(--window);
  border:1px solid var(--line-strong);
  border-radius:12px;
  display:flex; flex-direction:column;
  box-shadow:0 30px 70px rgba(0,0,0,0.55);
  overflow:hidden;
  transform: translateY(14px) scale(0.97);
  opacity:0;
  transition: transform .28s cubic-bezier(.2,.85,.25,1), opacity .22s ease, border-radius .25s ease, max-width .25s ease;
}
#windowLayer.show .window{ transform:none; opacity:1; }
@keyframes winIn{from{opacity:0; transform:translateY(14px) scale(0.98);} to{opacity:1; transform:none;}}
.content-fade{ animation: contentIn .3s cubic-bezier(.2,.8,.2,1); }
.win-titlebar{
  display:flex; align-items:center; gap:10px; justify-content:space-between;
  padding:9px 12px;
  background:linear-gradient(180deg, rgba(255,255,255,0.04), transparent);
  border-bottom:1px solid var(--line);
  flex-shrink:0;
}
.win-dots{display:flex; gap:8px; margin-left:auto;}
.wdot{
  width:26px; height:26px; border-radius:8px; cursor:pointer;
  display:flex; align-items:center; justify-content:center;
  transition: filter .12s, transform .12s;
}
.wdot svg{width:14px; height:14px;}
.wdot:hover{filter:brightness(1.15); transform:translateY(-1px);}
.wdot.red{background:rgba(248,113,113,0.18); color:#f87171; border:1px solid rgba(248,113,113,0.35);}
.wdot.yellow{background:rgba(251,191,36,0.18); color:#fbbf24; border:1px solid rgba(251,191,36,0.35);}
.wdot.green{background:rgba(52,211,153,0.18); color:#34d399; border:1px solid rgba(52,211,153,0.35);}
.win-titlebar .wt-title{font-family:var(--mono); font-size:12.5px; color:var(--text-dim); letter-spacing:0.4px;}
.win-titlebar .wt-icon{width:16px; height:16px;}

.window.fullscreen{
  position:fixed; inset:0; max-width:none; height:100vh; border-radius:0; z-index:400;
}
.window.fullscreen .wdot.green svg{ transform:rotate(180deg); }

.win-body{flex:1; overflow-y:auto; padding:22px 26px 40px;}

/* two-pane topic window */
.win-body.split{display:flex; padding:0; overflow:hidden;}
.topic-nav{
  width:230px; flex-shrink:0; border-right:1px solid var(--line);
  overflow-y:auto; padding:14px 10px; background:rgba(255,255,255,0.015);
}
.topic-nav-item{
  padding:10px 12px; border-radius:8px; cursor:pointer; font-size:12.5px; color:var(--text-dim);
  margin-bottom:3px; transition: background .15s, color .15s, transform .15s;
  display:flex; align-items:center; gap:8px;
}
.topic-nav-item:hover{background:rgba(255,255,255,0.05); transform:translateX(2px);}
.topic-nav-item.active{background:rgba(255,255,255,0.07); color:var(--text); font-weight:600;}
.topic-nav-item .tn-dot{width:6px; height:6px; border-radius:50%; flex-shrink:0;}
.topic-content{flex:1; overflow-y:auto; padding:24px 28px 44px;}
.topic-content-inner{animation: contentIn .28s cubic-bezier(.2,.8,.2,1);}
@keyframes contentIn{from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:none;}}

/* topic viewer */
.topic-blurb{color:var(--text-dim); font-size:13px; margin-bottom:18px; line-height:1.55; padding-bottom:16px; border-bottom:1px solid var(--line);}
.tsec{margin-bottom:20px;}
.tsec-h{display:flex; align-items:center; gap:8px; font-size:14.5px; font-weight:700; margin-bottom:10px;}
.pyq-badge{
  font-family:var(--mono); font-size:9px; padding:2px 7px; border-radius:999px;
  background:rgba(251,191,36,0.15); border:1px solid rgba(251,191,36,0.4); color:#fbbf24;
  letter-spacing:0.4px;
}
.tsec ul{margin:0; padding-left:0; list-style:none;}
.tsec li{
  position:relative; padding:7px 0 7px 20px; font-size:13px; color:var(--text-dim); line-height:1.55;
  border-bottom:1px dashed var(--line);
}
.tsec li:last-child{border-bottom:none;}
.tsec li::before{content:'▸'; position:absolute; left:0; color:var(--accent);}

/* content tables */
.ctable-wrap{overflow-x:auto; margin:4px 0 14px; border-radius:10px; border:1px solid var(--line);}
.ctable{width:100%; border-collapse:collapse; font-size:12.5px;}
.ctable th{
  text-align:left; padding:9px 13px; background:rgba(255,255,255,0.05);
  font-family:var(--mono); font-size:10px; text-transform:uppercase; letter-spacing:0.5px; color:var(--text-faint);
  border-bottom:1px solid var(--line-strong);
}
.ctable td{padding:10px 13px; border-bottom:1px solid var(--line); color:var(--text-dim); line-height:1.5;}
.ctable tr:last-child td{border-bottom:none;}
.ctable tr:hover td{background:rgba(255,255,255,0.02); color:var(--text);}
.ctable td:first-child{color:var(--text); font-weight:600;}

.diff-badge{
  font-family:var(--mono); font-size:9px; padding:2px 7px; border-radius:999px; letter-spacing:0.4px; text-transform:uppercase;
}
.diff-badge.easy{background:rgba(52,211,153,0.15); border:1px solid rgba(52,211,153,0.4); color:#34d399;}
.diff-badge.medium{background:rgba(251,191,36,0.15); border:1px solid rgba(251,191,36,0.4); color:#fbbf24;}
.diff-badge.hard{background:rgba(248,113,113,0.15); border:1px solid rgba(248,113,113,0.4); color:#f87171;}

/* topic index (desktop-like grid inside window for topic hub, unused but kept minimal) */

/* shortcuts app */
.shortcut-tabs{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:18px;}
.sc-tab{
  padding:8px 13px; border-radius:8px; cursor:pointer; font-size:11.5px; font-family:var(--mono);
  background:rgba(255,255,255,0.04); border:1px solid var(--line); color:var(--text-dim);
}
.sc-tab.active{border-color:var(--accent); color:var(--accent); background:rgba(56,189,248,0.12);}
.sc-table{width:100%; border-collapse:collapse;}
.sc-table tr{border-bottom:1px solid var(--line);}
.sc-table td{padding:10px 8px; font-size:12.5px; vertical-align:middle;}
.sc-key{
  font-family:var(--mono); font-size:11.5px; color:#38bdf8; background:rgba(56,189,248,0.08);
  border:1px solid rgba(56,189,248,0.25); padding:4px 9px; border-radius:6px; white-space:nowrap; display:inline-block;
}
.sc-desc{color:var(--text-dim);}
.sc-pyq{width:30px; text-align:center;}

/* abbreviations app */
.abbr-search{
  width:100%; padding:10px 14px; border-radius:8px; margin-bottom:16px;
  background:rgba(255,255,255,0.04); border:1px solid var(--line); color:var(--text);
  font-size:13px; outline:none; font-family:var(--sans);
}
.abbr-search:focus{border-color:var(--accent);}
.abbr-grid{display:grid; grid-template-columns:1fr 1fr; gap:8px;}
.abbr-item{
  background:rgba(255,255,255,0.03); border:1px solid var(--line); border-radius:8px;
  padding:9px 12px;
}
.abbr-item b{font-family:var(--mono); color:#38bdf8; font-size:12.5px;}
.abbr-item div{font-size:11.5px; color:var(--text-dim); margin-top:2px;}

/* quiz app */
.quiz-topic-row{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:18px;}
.quiz-topic-chip{
  padding:6px 12px; border-radius:999px; cursor:pointer; font-size:11px; font-family:var(--mono);
  background:rgba(255,255,255,0.04); border:1px solid var(--line); color:var(--text-dim);
}
.quiz-topic-chip.active{background:rgba(56,189,248,0.15); border-color:var(--accent); color:var(--accent);}
.quiz-score-row{display:flex; gap:10px; margin-bottom:18px;}
.qz-box{flex:1; text-align:center; padding:10px; border-radius:8px; background:rgba(255,255,255,0.03); border:1px solid var(--line);}
.qz-box .n{font-family:var(--mono); font-size:20px; font-weight:800;}
.qz-box .l{font-size:9.5px; color:var(--text-faint); text-transform:uppercase; letter-spacing:0.5px;}
.qz-prompt{
  background:rgba(255,255,255,0.03); border:1px solid var(--line); border-radius:10px;
  padding:18px; margin-bottom:16px;
}
.qz-prompt .qn{font-family:var(--mono); font-size:10px; color:var(--text-faint); margin-bottom:8px; text-transform:uppercase; letter-spacing:1px;}
.qz-prompt .qt{font-size:15px; font-weight:600; line-height:1.5;}
.qz-options{display:flex; flex-direction:column; gap:8px;}
.qz-opt{
  padding:12px 14px; border-radius:8px; cursor:pointer; font-size:13px;
  background:rgba(255,255,255,0.03); border:1px solid var(--line); transition:.12s;
}
.qz-opt:hover{border-color:var(--accent);}
.qz-opt.correct{background:rgba(52,211,153,0.15); border-color:#34d399; color:#34d399;}
.qz-opt.wrong{background:rgba(248,113,113,0.15); border-color:#f87171; color:#f87171;}
.qz-next{
  width:100%; padding:12px; border-radius:8px; border:none; cursor:pointer; margin-top:14px;
  background:var(--accent); color:#04222f; font-weight:700; font-size:12.5px;
}

/* notepad */
#notepadArea{
  width:100%; height:100%; min-height:400px; background:transparent; border:none; outline:none;
  color:var(--text); font-family:var(--mono); font-size:13px; line-height:1.6; resize:none;
}

/* search overlay */
#searchOverlay{
  position:fixed; inset:0; background:rgba(4,8,12,0.7); backdrop-filter:blur(6px);
  z-index:500; display:none; align-items:flex-start; justify-content:center; padding-top:14vh;
}
#searchOverlay.show{display:flex;}
.search-box{width:100%; max-width:560px;}
.search-box input{
  width:100%; padding:16px 18px; border-radius:12px; font-size:15px;
  background:var(--panel); border:1px solid var(--line-strong); color:var(--text); outline:none;
  font-family:var(--sans);
}
.search-hits{margin-top:10px; background:var(--panel); border:1px solid var(--line); border-radius:12px; overflow:hidden; max-height:50vh; overflow-y:auto;}
.search-hit{padding:12px 16px; cursor:pointer; border-bottom:1px solid var(--line); display:flex; align-items:center; gap:10px;}
.search-hit:last-child{border-bottom:none;}
.search-hit:hover{background:rgba(255,255,255,0.05);}
.search-hit .sh-tag{font-family:var(--mono); font-size:9px; padding:3px 7px; border-radius:5px; background:rgba(56,189,248,0.12); color:#38bdf8; text-transform:uppercase;}
.search-hit .sh-title{font-size:13px; color:var(--text);}
.search-hit .sh-sub{font-size:11px; color:var(--text-faint); margin-left:auto;}

/* start menu */
#startMenu{
  position:absolute; left:10px; bottom:60px; width:300px;
  background:var(--panel); backdrop-filter:blur(14px); border:1px solid var(--line-strong);
  border-radius:12px; padding:10px; z-index:300; display:none;
  box-shadow:0 20px 50px rgba(0,0,0,0.5);
}
#startMenu.show{display:block;}
.sm-item{
  display:flex; align-items:center; gap:10px; padding:10px 10px; border-radius:8px; cursor:pointer; font-size:12.5px;
}
.sm-item:hover{background:rgba(255,255,255,0.06);}
.sm-item svg{width:16px; height:16px; color:var(--accent);}
.sm-divider{height:1px; background:var(--line); margin:6px 4px;}

@media (max-width:820px){
  #desktop{grid-template-columns:repeat(auto-fill, 78px); grid-auto-rows:84px; padding:14px; gap:2px;}
  .icon .ibox{width:36px; height:36px;}
  .taskbar-search{display:none;}
}

/* ---------------- mnemonic / trick callout ---------------- */
.trick-box{
  display:flex; gap:10px; align-items:flex-start;
  background:linear-gradient(135deg, rgba(251,191,36,0.09), rgba(251,191,36,0.03));
  border:1px solid rgba(251,191,36,0.28); border-radius:10px;
  padding:12px 14px; margin:10px 0 4px; font-size:12.5px; line-height:1.6; color:#fde68a;
}
.trick-box .tb-emoji{font-size:16px; flex-shrink:0;}
.trick-box b{color:#fbbf24;}

/* ---------------- flashcards ---------------- */
.flash-deck-row{display:flex; gap:8px; margin-bottom:18px; flex-wrap:wrap;}
.flash-deck-btn{
  flex:0 1 auto; text-align:center; padding:9px 14px; border-radius:8px; cursor:pointer; font-size:11.5px; font-family:var(--mono);
  background:rgba(255,255,255,0.04); border:1px solid var(--line); color:var(--text-dim); transition:.15s;
}
.flash-deck-btn.active{background:rgba(244,114,182,0.15); border-color:#f472b6; color:#f472b6;}
.flash-progress{text-align:center; font-family:var(--mono); font-size:11px; color:var(--text-faint); margin-bottom:12px;}
.flash-card{
  min-height:220px; border-radius:14px; cursor:pointer; perspective:1000px;
  margin-bottom:18px;
}
.flash-card-inner{
  position:relative; width:100%; height:220px; text-align:center;
  transition: transform 0.5s; transform-style:preserve-3d;
}
.flash-card.flipped .flash-card-inner{ transform:rotateY(180deg); }
.flash-face{
  position:absolute; inset:0; backface-visibility:hidden;
  display:flex; align-items:center; justify-content:center; flex-direction:column; gap:10px;
  border-radius:14px; padding:24px; border:1px solid var(--line-strong);
}
.flash-front{ background:linear-gradient(150deg, rgba(244,114,182,0.14), rgba(244,114,182,0.03)); }
.flash-front .ff-label{font-family:var(--mono); font-size:9.5px; color:#f472b6; text-transform:uppercase; letter-spacing:1.2px;}
.flash-front .ff-term{font-size:19px; font-weight:700;}
.flash-back{
  background:linear-gradient(150deg, rgba(56,189,248,0.14), rgba(56,189,248,0.03));
  transform:rotateY(180deg); font-size:13.5px; line-height:1.6; color:var(--text-dim);
}
.flash-hint{text-align:center; font-size:10.5px; color:var(--text-faint); margin-bottom:14px; font-family:var(--mono);}
.flash-nav{display:flex; gap:8px;}
.flash-nav button{
  flex:1; padding:11px; border-radius:8px; border:1px solid var(--line); cursor:pointer;
  background:rgba(255,255,255,0.04); color:var(--text-dim); font-size:12px; font-family:var(--mono);
}
.flash-nav button.primary{background:#f472b6; border-color:#f472b6; color:#2a0a19; font-weight:700;}

/* ---------------- typing test ---------------- */
.dest-info-row{display:flex; gap:10px; margin-bottom:16px; flex-wrap:wrap;}
.dest-stat{
  flex:1; min-width:90px; text-align:center; padding:10px 6px; border-radius:8px;
  background:rgba(255,255,255,0.03); border:1px solid var(--line);
}
.dest-stat .n{font-family:var(--mono); font-size:19px; font-weight:800; color:#38bdf8;}
.dest-stat .l{font-size:9px; color:var(--text-faint); text-transform:uppercase; letter-spacing:0.5px;}
.dest-passage{
  background:rgba(255,255,255,0.03); border:1px solid var(--line); border-radius:10px;
  padding:16px 18px; font-family:var(--mono); font-size:14px; line-height:1.85; letter-spacing:0.2px;
  margin-bottom:14px; max-height:180px; overflow-y:auto; user-select:none;
}
.dest-passage span.correct{color:#34d399;}
.dest-passage span.wrong{color:#f87171; background:rgba(248,113,113,0.18); border-radius:2px;}
.dest-passage span.pending{color:var(--text-faint);}
.dest-passage span.current{background:rgba(56,189,248,0.35); border-radius:2px;}
.dest-input{
  width:100%; min-height:110px; padding:14px; border-radius:10px; resize:none;
  background:rgba(0,0,0,0.25); border:1px solid var(--line-strong); color:var(--text);
  font-family:var(--mono); font-size:14px; line-height:1.7; outline:none;
}
.dest-input:focus{border-color:#38bdf8;}
.dest-controls{display:flex; gap:10px; margin-top:14px;}
.dest-btn{
  flex:1; padding:12px; border-radius:8px; border:none; cursor:pointer; font-weight:700; font-size:12.5px; font-family:var(--mono);
}
.dest-btn.start{background:#38bdf8; color:#04222f;}
.dest-btn.submit{background:#f87171; color:#2a0808;}
.dest-btn:disabled{opacity:0.4; cursor:not-allowed;}
.dest-result{
  border-radius:12px; padding:22px; text-align:center; margin-bottom:16px;
}
.dest-result.pass{background:rgba(52,211,153,0.1); border:1px solid rgba(52,211,153,0.35);}
.dest-result.fail{background:rgba(248,113,113,0.1); border:1px solid rgba(248,113,113,0.35);}
.dest-result .verdict{font-size:22px; font-weight:800; margin-bottom:6px;}
.dest-result.pass .verdict{color:#34d399;}
.dest-result.fail .verdict{color:#f87171;}
.dest-result .verdict-sub{font-size:12px; color:var(--text-dim);}
.dest-note{font-size:11px; color:var(--text-faint); line-height:1.6; margin-top:10px;}

/* typing mode toggle */
.dest-mode-row{display:flex; gap:8px; margin-bottom:16px;}
.dest-mode-btn{
  flex:1; padding:10px; text-align:center; border-radius:8px; cursor:pointer; font-size:11.5px; font-family:var(--mono);
  background:rgba(255,255,255,0.04); border:1px solid var(--line); color:var(--text-dim); transition:.15s;
}
.dest-mode-btn.active{background:rgba(56,189,248,0.15); border-color:#38bdf8; color:#38bdf8;}
.dest-length-row{display:flex; gap:8px; margin-bottom:16px;}
.dest-len-btn{
  padding:7px 12px; border-radius:999px; cursor:pointer; font-size:10.5px; font-family:var(--mono);
  background:rgba(255,255,255,0.04); border:1px solid var(--line); color:var(--text-dim); transition:.15s;
}
.dest-len-btn.active{background:rgba(52,211,153,0.15); border-color:#34d399; color:#34d399;}

/* ---------------- formula lab ---------------- */
.flab-grid-wrap{margin-bottom:18px; border-radius:10px; overflow:hidden; border:1px solid var(--line);}
.flab-table{width:100%; border-collapse:collapse; font-size:12.5px;}
.flab-table th{background:rgba(56,189,248,0.08); color:#38bdf8; font-family:var(--mono); padding:8px; text-align:center; border:1px solid var(--line);}
.flab-table td{padding:8px; text-align:center; border:1px solid var(--line); color:var(--text-dim);}
.flab-table td:first-child, .flab-table th:first-child{background:rgba(255,255,255,0.04); font-family:var(--mono); color:var(--text-faint);}
.flab-progress{font-family:var(--mono); font-size:11px; color:var(--text-faint); margin-bottom:10px;}
.flab-task{
  background:rgba(255,255,255,0.03); border:1px solid var(--line); border-radius:10px;
  padding:16px 18px; margin-bottom:14px; font-size:13.5px; line-height:1.6;
}
.flab-task .fl-diff{margin-bottom:8px;}
.flab-input-row{display:flex; gap:8px; margin-bottom:12px;}
.flab-input{
  flex:1; padding:12px 14px; border-radius:8px; background:rgba(0,0,0,0.25);
  border:1px solid var(--line-strong); color:#38bdf8; font-family:var(--mono); font-size:13.5px; outline:none;
}
.flab-input:focus{border-color:#38bdf8;}
.flab-input.correct{border-color:#34d399; color:#34d399;}
.flab-input.wrong{border-color:#f87171; color:#f87171;}
.flab-btn{padding:12px 16px; border-radius:8px; border:none; cursor:pointer; font-weight:700; font-size:12px; font-family:var(--mono);}
.flab-btn.check{background:#38bdf8; color:#04222f;}
.flab-btn.hint{background:rgba(251,191,36,0.15); border:1px solid rgba(251,191,36,0.4); color:#fbbf24;}
.flab-btn.next{background:#34d399; color:#052015; width:100%; margin-top:10px;}
.flab-hint-box{
  background:rgba(251,191,36,0.08); border:1px solid rgba(251,191,36,0.25); border-radius:8px;
  padding:10px 13px; font-size:12px; color:#fde68a; margin-bottom:12px; display:none;
}
.flab-hint-box.show{display:block; animation:contentIn .25s;}
.flab-feedback{font-family:var(--mono); font-size:12px; margin-bottom:10px; padding:10px; border-radius:8px; display:none;}
.flab-feedback.show{display:block; animation:contentIn .25s;}
.flab-feedback.correct{background:rgba(52,211,153,0.1); color:#34d399;}
.flab-feedback.wrong{background:rgba(248,113,113,0.1); color:#f87171;}
.flab-score{display:flex; gap:10px; margin-bottom:16px;}
</style>

<script>
const CONTENT = {"topics":[{"id":"basics","title":"Computer Basics","icon":"cpu","color":"#22d3ee","blurb":"Organization, I/O devices, memory & storage, backup & ports.","subtopics":[{"id":"organization","title":"Computer Organization","pyq":true,"blocks":[{"type":"list","items":["The CPU (Central Processing Unit) is the 'brain' of the computer \u2014 it fetches, decodes, and executes instructions.","Motherboard is the main circuit board that connects the CPU, memory, and all other components."]},{"type":"table","headers":["Component","Function"],"rows":[["ALU (Arithmetic Logic Unit)","Performs arithmetic (+,-,\u00d7,\u00f7) and logical (AND, OR, NOT) operations"],["CU (Control Unit)","Directs & coordinates operations \u2014 tells other parts what to do and when"],["Registers","Tiny, ultra-fast storage inside the CPU holding data currently being processed"],["Accumulator","Register that stores the result of ALU operations"],["Program Counter (PC)","Holds the address of the NEXT instruction to be executed"],["MAR / MDR","Memory Address Register / Memory Data Register \u2014 hold the address & data being read/written"]]},{"type":"table","headers":["Motherboard Part","Purpose"],"rows":[["CPU Socket","Holds & connects the processor"],["RAM Slots","Hold memory modules"],["Chipset","Manages data flow between CPU, RAM & peripherals"],["BIOS/UEFI Chip","Stores firmware that boots the system"],["Expansion Slots (PCIe)","Let you add graphics cards, sound cards, etc."]]},{"type":"trick","text":"CPU Organization = CU + ALU + Registers. CU tells, ALU does, Registers hold \u2014 like a manager (CU), a worker (ALU), and a clipboard (Registers)."}]},{"id":"io","title":"Input and Output Devices","pyq":true,"blocks":[{"type":"table","headers":["Input Device","What it does"],"rows":[["Keyboard / Mouse","Manual text entry / pointing"],["Scanner","Converts a physical document into a digital image"],["OMR (Optical Mark Recognition)","Reads filled-in bubbles \u2014 e.g. exam answer sheets"],["OCR (Optical Character Recognition)","Converts scanned/printed text into editable digital text"],["MICR (Magnetic Ink Character Recognition)","Reads the special ink numbers on bank cheques"],["Joystick / Light Pen / Webcam","Gaming input / screen drawing input / video capture"]]},{"type":"table","headers":["Monitor Type","Key Trait"],"rows":[["CRT (Cathode Ray Tube)","Older, bulky, uses an electron gun \u2014 largely obsolete"],["LCD (Liquid Crystal Display)","Flat, uses liquid crystals + backlight, energy efficient"],["LED (Light Emitting Diode)","An LCD variant backlit by LEDs \u2014 thinner, better contrast"]]},{"type":"table","headers":["Printer Type","Examples","Trait"],"rows":[["Impact","Dot-matrix","Physically strikes the paper \u2014 noisy, can print carbon copies"],["Non-impact","Inkjet, Laser","No physical strike \u2014 quieter; Laser is fastest & highest quality"]]},{"type":"list","items":["Plotter \u2014 draws large, precise technical images (maps, architectural/engineering drawings) using pens.","Projector \u2014 displays a computer's output onto a large external screen."]}]},{"id":"memory","title":"Memory and Storage","pyq":true,"blocks":[{"type":"table","headers":["Unit","Equals"],"rows":[["1 Byte","8 Bits"],["1 KB","1024 Bytes"],["1 MB","1024 KB"],["1 GB","1024 MB"],["1 TB","1024 GB"],["1 PB (Petabyte)","1024 TB"],["1 EB (Exabyte)","1024 PB"]]},{"type":"table","headers":["RAM Type","Trait"],"rows":[["SRAM (Static)","Faster, more expensive, used as cache \u2014 doesn't need refreshing"],["DRAM (Dynamic)","Slower, cheaper, used as main RAM \u2014 needs constant refreshing"]]},{"type":"table","headers":["ROM Type","Trait"],"rows":[["PROM","Programmable once by the user, then permanent"],["EPROM","Erasable using ultraviolet light, then reprogrammable"],["EEPROM","Electrically erasable & reprogrammable \u2014 no UV light needed"]]},{"type":"table","headers":["Cache Level","Location & Speed"],"rows":[["L1","Built into the CPU core \u2014 smallest, fastest"],["L2","Slightly further from the core \u2014 larger, a bit slower than L1"],["L3","Shared across CPU cores \u2014 largest, slowest of the three (still far faster than RAM)"]]},{"type":"table","headers":["Secondary Storage","Trait"],"rows":[["HDD","Magnetic spinning disk, cheaper per GB, slower, moving parts"],["SSD","Flash memory, no moving parts, much faster, more expensive per GB"],["Magnetic Tape","Sequential access, very cheap per GB, used for long-term backup/archival"]]},{"type":"trick","text":"Every step in the memory unit ladder is \u00d71024, NOT \u00d71000 \u2014 SSC's favourite trap question."}]},{"id":"backup","title":"Backup Devices and Ports","pyq":true,"blocks":[{"type":"table","headers":["Backup Device","Trait"],"rows":[["Flash/USB Drive","Small, portable, flash-based"],["External HDD/SSD","Large capacity, portable, connects via USB"],["CD","~700 MB capacity, optical disc"],["DVD","4.7 GB (single layer) optical disc \u2014 much more than a CD"],["Blu-ray","25\u201350 GB+ optical disc \u2014 highest capacity of the three"]]},{"type":"table","headers":["Port","Use"],"rows":[["USB Type-A","Classic rectangular USB connector"],["USB Type-B","Squarish connector, often used for printers"],["USB Type-C","Reversible, modern, found on most new laptops/phones"],["Serial Port","Legacy, transmits data one bit at a time"],["Parallel Port","Legacy, transmits multiple bits at once \u2014 was common for printers"],["HDMI","Digital video + audio in a single cable"],["VGA","Older analog video-only port"],["PS/2","Legacy round port for keyboard/mouse"]]}]}]},{"id":"software","title":"Software & OS","icon":"layers","color":"#a78bfa","blurb":"OS foundations, Windows basics, system vs application software.","subtopics":[{"id":"osfound","title":"Operating System Foundations","pyq":true,"blocks":[{"type":"list","items":["An OS is system software that manages hardware and provides a platform for applications to run on."]},{"type":"table","headers":["OS Function","What it means"],"rows":[["Process Management","Decides which program runs when, and for how long"],["Memory Management","Allocates & frees RAM for running programs"],["Device Management","Coordinates hardware via drivers"],["File Management","Organizes, names, and stores files & folders"]]},{"type":"table","headers":["Interface","Trait"],"rows":[["GUI (Graphical)","Icons, windows, mouse-driven \u2014 user friendly, e.g. Windows desktop"],["CLI (Command Line)","Typed text commands \u2014 faster for experts, e.g. Terminal/Command Prompt"]]},{"type":"table","headers":["OS Type","Trait"],"rows":[["Batch","Jobs collected & processed in groups with no user interaction during execution"],["Multi-programming","Multiple programs held in memory at once, CPU switches between them"],["Time-sharing","CPU time is divided into slices so multiple users feel they have simultaneous access"],["Real-time","Guarantees a response within a strict, predictable time \u2014 e.g. traffic control systems"]]}]},{"id":"windows","title":"Windows OS Basics","pyq":true,"blocks":[{"type":"list","items":["File Explorer (Windows Explorer) is used to browse, move, copy, and organize files & folders.","Directory navigation follows a tree: Drive \u2192 Folder \u2192 Sub-folder \u2192 File."]},{"type":"table","headers":["Extension","File Type"],"rows":[[".docx",".xlsx / .pptx (Word / Excel / PowerPoint)"],[".pdf","Portable Document Format"],[".jpg / .png","Image files"],[".mp3 / .mp4","Audio / video files"],[".exe","Executable program"],[".zip","Compressed archive"],[".txt / .html","Plain text / web page"]]},{"type":"list","items":["Desktop \u2014 the main screen holding icons & shortcuts.","Taskbar \u2014 the bar (usually bottom) showing the Start button, open apps, and system tray/clock.","Control Panel \u2014 where system settings (display, network, users, programs) are managed."]}]},{"id":"sysapp","title":"System & Application Software","pyq":false,"blocks":[{"type":"table","headers":["System Software","Job"],"rows":[["Compiler","Translates an ENTIRE high-level program into machine code at once, before running"],["Interpreter","Translates & executes code line-by-line, on the fly"],["Assembler","Translates assembly language into machine code"],["Device Driver","Lets the OS communicate with a specific piece of hardware"]]},{"type":"table","headers":["Application Software","Example"],"rows":[["General purpose","MS Word, browsers \u2014 usable for many different tasks"],["Customized / specific-purpose","Hospital billing software, payroll software \u2014 built for one job"]]},{"type":"trick","text":"Compiler = translates the whole book before you read it. Interpreter = translates sentence-by-sentence as you read."}]}]},{"id":"word","title":"MS Word","icon":"file-text","color":"#38bdf8","blurb":"Document creation, formatting, page setup, and advanced tools.","subtopics":[{"id":"docbasics","title":"Document Creation, Editing & Saving","pyq":true,"blocks":[{"type":"list","items":["New documents open with Ctrl+N; save with Ctrl+S; Save As lets you choose format/location.","Default file extension is .docx (older format: .doc); can export directly to PDF via Save As.","Undo (Ctrl+Z) / Redo (Ctrl+Y) let you step backward/forward through edits."]}]},{"id":"formatting","title":"Text Formatting","pyq":true,"blocks":[{"type":"table","headers":["Element","Options"],"rows":[["Font","Typeface, size, colour, bold/italic/underline"],["Paragraph","Alignment (left/centre/right/justify), indentation"],["Line spacing","Single, 1.5, double, or custom"]]}]},{"id":"pagesetup","title":"Page Setup","pyq":false,"blocks":[{"type":"table","headers":["Setting","Purpose"],"rows":[["Margins","Blank space around the edge of each page"],["Orientation","Portrait (tall) or Landscape (wide)"],["Header / Footer","Repeated content at the top/bottom of every page"],["Page Numbers","Auto-inserted numbering, placed in header/footer"]]}]},{"id":"advtools","title":"Advanced Tools","pyq":true,"blocks":[{"type":"table","headers":["Tool","What it does"],"rows":[["Mail Merge","Combines a form letter with a data source to send personalised copies to many people"],["Tables","Organize content into rows & columns within the document"],["WordArt","Stylized, decorative text effects"],["Hyperlink","Clickable link to a webpage, file, or another part of the document"],["Track Changes","Records every edit a reviewer makes without altering the original text"],["Find & Replace (Ctrl+H)","Search and swap text across the whole document"]]}]}]},{"id":"excel","title":"MS Excel","icon":"grid","color":"#34d399","blurb":"Workbook mechanics, data tools, charts, formulas, and referencing.","subtopics":[{"id":"mechanics","title":"Workbook & Worksheet Mechanics","pyq":true,"blocks":[{"type":"list","items":["A Workbook (.xlsx file) contains multiple Worksheets (tabs).","A Worksheet is a grid of Cells, each identified by Column letter + Row number (e.g. B5).","A Range is a group of cells written as A1:A10 (start:end)."]}]},{"id":"datatools","title":"Data Entry, Sorting, Filtering & Formatting","pyq":false,"blocks":[{"type":"list","items":["Sort \u2014 arranges rows by a column's values (ascending/descending).","Filter \u2014 temporarily hides rows that don't match a condition.","Conditional Formatting \u2014 automatically changes a cell's appearance (colour, icon) based on its value."]}]},{"id":"charts","title":"Charts","pyq":false,"blocks":[{"type":"table","headers":["Chart Type","Best for"],"rows":[["Bar / Column","Comparing values across categories"],["Line","Showing trends over time"],["Pie","Showing proportion of a whole"],["Scatter","Showing the relationship between two numeric variables"]]}]},{"id":"formulas","title":"Formulas & Functions","pyq":true,"blocks":[{"type":"list","items":["Every formula in Excel starts with an equals sign ( = )."]},{"type":"table","headers":["Function","Syntax","Use"],"rows":[["SUM","=SUM(range)","Adds up all values in a range"],["AVERAGE","=AVERAGE(range)","Mean of the values in a range"],["COUNT / COUNTIF","=COUNTIF(range, criteria)","Counts cells, optionally matching a condition"],["IF","=IF(condition, true_val, false_val)","Conditional logic"],["VLOOKUP","=VLOOKUP(value, table, col_index, [exact])","Looks up a value in a table's first column"],["MAX / MIN","=MAX(range) / =MIN(range)","Largest / smallest value in a range"]]}]},{"id":"referencing","title":"Cell Referencing","pyq":true,"blocks":[{"type":"table","headers":["Type","Written as","Behaviour when copied"],"rows":[["Relative","A1","Changes to match the new location"],["Absolute","$A$1","Stays completely fixed"],["Mixed","A$1 or $A1","Locks only the row, or only the column"]]},{"type":"trick","text":"F4 cycles through relative \u2192 absolute \u2192 mixed \u2192 mixed while editing a formula \u2014 a genuine time-saver worth memorising."}]}]},{"id":"ppt","title":"MS PowerPoint","icon":"monitor","color":"#f472b6","blurb":"Slide creation, views, animation & transition effects.","subtopics":[{"id":"slidebasics","title":"Slide Creation, Layouts & Themes","pyq":false,"blocks":[{"type":"list","items":["A Layout defines the placeholders (title, content, image) arranged on a slide.","A Theme applies a consistent colour palette, fonts, and effects across every slide.","Slide Master controls formatting applied to ALL slides at once."]}]},{"id":"views","title":"Presentation Views","pyq":true,"blocks":[{"type":"table","headers":["View","Purpose"],"rows":[["Normal","Default view for editing a single slide"],["Slide Sorter","Thumbnail view of all slides \u2014 great for reordering"],["Reading View","Runs the show within the app window (not full screen)"],["Slide Show (F5)","Full-screen presentation, starts from slide 1 (Shift+F5 starts from current slide)"]]}]},{"id":"animations","title":"Animations","pyq":true,"blocks":[{"type":"table","headers":["Category","Effect"],"rows":[["Entrance","How an object first appears on the slide"],["Emphasis","Draws attention to an object already on ack floods a system using:","options":["A single source","Many sources at once","Email spam only","Fake certificates"],"a":1,"topic":"network","pyq":true,"diff":"medium"},{"q":"Which secretly records every keystroke a user types?","options":["Ransomware","Keylogger","Firewall","Router"],"a":1,"topic":"network","pyq":true,"diff":"medium"},{"q":"IPv4 addresses are how many bits long?","options":["16-bit","32-bit","64-bit","128-bit"],"a":1,"topic":"network","pyq":false,"diff":"hard"},{"q":"A MAC address identifies:","options":["A website","A unique physical hardware device","An email account","A file type"],"a":1,"topic":"network","pyq":false,"diff":"medium"},{"q":"Which cable type is fastest and most resistant to interference?","options":["Twisted pair","Coaxial","Fiber optic","Ethernet copper"],"a":2,"topic":"network","pyq":false,"diff":"medium"},{"q":"Two-Factor Authentication adds:","options":["A second verification step","A faster login","A bigger password box","A new username"],"a":0,"topic":"network","pyq":true,"diff":"easy"},{"q":"A Trojan Horse differs from a virus because it:","options":["Self-replicates faster","Does NOT self-replicate","Only affects Macs","Is always harmless"],"a":1,"topic":"network","pyq":true,"diff":"medium"}],"typing":{"passages":["Digital literacy has become one of the most important skills for citizens in the modern age. Government offices across the country are steadily moving their services online, allowing people to apply for certificates, pay bills, and file applications without visiting a physical office. This shift has reduced paperwork considerably and has made governance more transparent. However, it has also created a new challenge: not every citizen is equally comfortable using a computer or a smartphone. Rural areas, in particular, often lack reliable internet connectivity and trained staff who can guide first-time users. To address this gap, many state governments have started community digital literacy programs. These programs teach basic skills such as opening an email account, filling an online form, and recognizing fraudulent messages. Cyber safety is given special attention, since new internet users are often the most vulnerable to scams. Trainers explain simple habits like never sharing a one-time password with a stranger, checking a website's address carefully before entering banking details, and using strong, unique passwords for every account. Employers, too, have realized that basic computer proficiency is now a baseline expectation for almost every entry-level government and private sector job. Recruitment examinations increasingly include a computer knowledge section, testing candidates on operating systems, common software applications, and safe internet practices. Beyond passing an examination, these skills matter every single day at the workplace, whether it is drafting a letter, preparing a spreadsheet of expenses, or sending a properly formatted email to a supervisor. Libraries and community centers in many towns now offer free computer access along with short courses, hoping to bridge the digital divide between urban and rural populations. Volunteers, often college students, spend their weekends helping older residents learn to video call their families or check their bank balance online. Over time, such small acts of teaching create a ripple effect, as newly trained individuals go on to help their own neighbours and relatives. The long-term goal of these efforts is not simply technical competence, but confidence: a person who is not afraid to try, to make a mistake, and to try again on a screen full of unfamiliar icons. As more essential services move online in the coming years, this kind of grassroots digital confidence will matter just as much as electricity or clean water in determining how fully a citizen can participate in public life.","Environmental conservation has moved from being a niche concern to a central part of public policy discussions around the world. Rising temperatures, unpredictable rainfall, and shrinking forest cover have made it clear that unchecked development carries a heavy long-term cost. Many countries have responded by setting ambitious targets for renewable energy, aiming to replace coal and oil-based power plants with solar, wind, and hydroelectric alternatives within a few decades. Achieving these targets requires not only new technology but also significant changes in how citizens think about daily consumption. Simple habits, such as switching off unused lights, choosing public transport over private vehicles, and reducing single-use plastic, collectively make a measurable difference when adopted widely. Educational institutions have begun incorporating environmental studies into their curriculum from an early age, hoping that children will grow up with sustainability as second nature rather than an afterthought. Corporate organisations, too, are under increasing pressure from regulators and consumers alike to disclose their carbon footprint and to adopt greener manufacturing practices. Some industries have found that environmentally responsible choices can also be commercially sound, since energy-efficient processes tend to lower costs over time. Wildlife conservation remains a parallel priority, with several endangered species surviving today only because of dedicated protected areas and strict anti-poaching laws. Local communities living near forests are often enlisted as partners in these conservation efforts, since their traditional knowledge of the land can be invaluable in tracking animal movement and identifying threats early. International cooperation plays an equally important role, as environmental problems rarely respect national borders; a river polluted upstream in one country can affect the livelihoods of millions living downstream in another. Treaties and shared monitoring systems allow neighbouring nations to coordinate their response to floods, droughts, and habitat loss more effectively than any single government could manage alone. While the scale of the challenge can feel overwhelming, history shows that determined collective action, sustained over years rather than months, can reverse damage once thought permanent. The recovery of once-vanishing species and the slow return of clean air to cities that had been notorious for pollution both stand as reminders that environmental policy, when consistently applied, produces results that benefit every citizen, not merely those who advocated for it in the first place.","Effective time management is often described as the single most valuable skill a working professional can develop, yet it remains one of the hardest habits to build consistently. The modern workplace bombards employees with emails, meeting invitations, and instant messages throughout the day, each competing for immediate attention. Without a clear system for prioritising tasks, it becomes easy to spend an entire day reacting to whatever arrived most recently, rather than making progress on work that truly matters. Productivity experts frequently recommend starting each morning by identifying no more than three tasks that, if completed, would make the day genuinely successful. This approach forces a person to distinguish between what feels urgent and what is actually important, a distinction that is surprisingly easy to lose sight of during a busy week. Breaking larger projects into smaller, clearly defined steps also helps maintain momentum, since visible progress tends to be far more motivating than a vague, distant deadline. Many professionals now use digital calendars and task management applications to keep track of their commitments, setting reminders well before a deadline rather than relying on memory alone. These tools are most useful when paired with the discipline to review and update them regularly; a calendar filled with outdated entries quickly becomes as unreliable as no calendar at all. Taking short, deliberate breaks throughout the day has also been shown to improve overall concentration, countering the common misconception that longer, uninterrupted work sessions are always more productive. Office environments that encourage employees to step away from their screens periodically often report higher quality work and fewer errors by the end of the day. Communication skills play a supporting role as well, since a significant amount of time is lost to misunderstandings that could have been avoided with a clearer initial request or a more specific set of instructions. Learning to say no to tasks that do not align with one's actual responsibilities, though difficult in a collaborative workplace, is frequently cited as one of the most liberating professional skills a person can acquire. Ultimately, good time management is less about squeezing more work into each hour and more about protecting enough uninterrupted time for the handful of tasks that genuinely move a career or a project forward.","The history of banking in India reflects the broader story of the nation's economic development over the past century. In the years following independence, access to formal banking remained limited to urban centres, leaving a vast rural population dependent on informal moneylenders who often charged exploitative rates of interest. Recognising this gap, the government pursued a policy of bank nationalisation, bringing major commercial banks under public ownership with an explicit mandate to expand into underserved regions. Branches began appearing in small towns and villages that had never before had access to a savings account, let alone a loan for agricultural equipment or a small business. Decades later, the introduction of core banking systems allowed customers to transact from any branch of their bank rather than being tied to the single branch where their account was originally opened, a change that seems minor today but was transformative at the time. The most significant shift, however, arrived with the spread of mobile phones and affordable internet access. Digital payment platforms enabled ordinary citizens to transfer money instantly using nothing more than a mobile number or a scanned code, bypassing the need to visit a branch entirely for many everyday transactions. Government schemes aimed at financial inclusion further accelerated this transformation, encouraging households that had never held a bank account to open one, often linked directly to subsidy payments and welfare benefits. This direct transfer mechanism reduced leakage and delays that had long plagued paper-based disbursement systems. Security, naturally, became a growing concern as more transactions moved online, prompting banks to invest heavily in fraud detection systems and to educate customers about safe practices such as never sharing personal identification numbers or one-time passwords. Regulatory bodies have continuously updated their guidelines to keep pace with new technology, balancing the goal of convenience against the very real risk of cybercrime. Today, a farmer in a remote village can check crop insurance payouts on a basic smartphone, a feat that would have seemed almost unimaginable only two decades earlier. The ongoing challenge for policymakers is to ensure that this rapid technological progress continues to include those with the least access to digital devices, so that the benefits of a modern banking system reach every citizen rather than only those already well connected.","Public libraries have long served as quiet centres of learning within their communities, but their role has expanded considerably in the digital era. Where a library was once defined almost entirely by its collection of printed books, many now function as technology hubs offering free internet access, computer training, and even three-dimensional printing equipment for local entrepreneurs and students. This transformation has been particularly significant for families who cannot otherwise afford a personal computer or a stable broadband connection at home. Children visiting after school can complete online assignments, research projects for class, and gain comfort with digital tools well before such skills are formally taught in the classroom. Librarians, once primarily responsible for cataloguing and recommending books, increasingly find themselves teaching basic computer skills, helping patrons draft resumes, or troubleshooting a printer that refuses to cooperate. Many libraries now host workshops on topics ranging from safe internet browsing to introductory coding, recognising that literacy today extends well beyond the ability to read a printed page. Job seekers, particularly those from older generations who did not grow up using computers, rely on these free resources to complete online applications that increasingly serve as the only accepted format for public and private sector recruitment. Without such support, an otherwise qualified candidate might be excluded from an opportunity simply due to unfamiliarity with a digital form or an online portal. Community centres attached to libraries frequently organise sessions specifically for senior citizens, teaching them to video call distant relatives, manage their pension accounts online, or recognise common online scams targeting the elderly. This intergenerational exchange, where younger volunteers guide older residents through unfamiliar technology, has strengthened community bonds in ways that go beyond the original mission of a public library. Funding for these expanded services remains a persistent challenge, as budgets allocated decades ago for books and staff salaries must now also stretch to cover computer maintenance, software licensing, and reliable high-speed internet. Advocates argue that this investment pays for itself many times over, since a digitally confident population contributes more effectively to the local economy and requires less assistance navigating essential government services. As more of daily life moves online, the humble neighbourhood library, once associated purely with silence and stacks of books, has quietly become one of the most practical entry points into the digital world for millions of people.","Small businesses across the country have increasingly turned to social media platforms not merely as a marketing tool but as a primary channel for customer service and sales. A local bakery, for instance, might receive most of its custom cake orders through direct messages rather than phone calls, while a tailoring shop could showcase its latest designs to thousands of potential customers without spending a single rupee on traditional advertising. This shift has lowered the barrier to entry for entrepreneurship considerably, allowing individuals with limited capital to reach an audience that would once have required an expensive storefront in a busy market. However, this convenience comes with new responsibilities that many first-time business owners are unprepared for. Maintaining a consistent posting schedule, responding promptly to customer queries, and managing online reviews all demand time that a single shop owner juggling several roles may struggle to find. Training programs aimed at small entrepreneurs have started including modules on digital marketing alongside traditional bookkeeping, recognising that a shopkeeper today is as likely to need a working knowledge of social media algorithms as an understanding of profit margins. Payment technology has evolved in parallel, with quick response codes displayed at even the smallest roadside stalls allowing customers to pay instantly without handling cash. This has simplified accounting considerably, since every transaction is automatically recorded, reducing both the risk of theft and the tedious task of manually tallying the day's earnings each evening. Despite these advantages, a significant number of small business owners remain hesitant to adopt digital tools fully, citing concerns about transaction fees, unfamiliarity with the technology, or simple distrust built over years of cash-based dealings. Community workshops run by local trade associations have proven effective at addressing these concerns, pairing hesitant shopkeepers with younger volunteers who can demonstrate the tools in a low-pressure, familiar setting. As more of the local economy moves online, the businesses that adapt earliest often report a noticeable increase in walk-in customers, many of whom discovered the shop through a friend's shared post rather than by simply passing on the street.","Renewable energy adoption at the household level has grown steadily as the cost of solar panels continues to fall and government incentive schemes make installation more affordable for ordinary families. A homeowner considering rooftop solar today faces a very different calculation than one from a decade ago, when the upfront investment often took well over a decade to recover through reduced electricity bills. Modern panels are not only cheaper to manufacture but also considerably more efficient, meaning fewer panels are needed to generate the same amount of power, which in turn reduces both material costs and the physical space required on a roof. Financing options have expanded alongside this technological progress, with several banks now offering dedicated green loans at preferential interest rates specifically for solar installations. Net metering arrangements, where excess electricity generated during peak sunlight hours is fed back into the grid in exchange for credit, have further improved the economics for households that cannot use all the power they generate immediately. Beyond the financial calculations, many families cite energy independence and reduced vulnerability to power cuts as equally important motivations for making the switch. Rural areas, which have historically suffered from unreliable grid connections, have found solar particularly transformative, since a household system paired with battery storage can provide consistent power even when the wider grid experiences outages. Installers report that customer awareness has improved considerably in recent years, with fewer families needing extensive persuasion about the basic viability of the technology and more asking detailed, informed questions about warranty terms and maintenance schedules. This shift reflects a broader cultural change, where solar panels are no longer viewed as an experimental novelty reserved for environmentally conscious early adopters but as a mainstream home improvement comparable to installing a new water heater or renovating a kitchen. Local governments have taken note of this changing perception and have begun streamlining the approval process for rooftop installations, recognising that lengthy bureaucratic delays were previously one of the biggest deterrents for interested homeowners.","The transition from paper-based medical records to electronic health systems has fundamentally changed how hospitals and clinics manage patient information, though the journey has not been without significant challenges. Under the old system, a patient's complete medical history often existed only as a physical file that could be misplaced, damaged, or simply unavailable when the patient sought treatment at a different facility during an emergency. Electronic records solve this problem in theory by making a patient's history accessible to any authorised healthcare provider instantly, regardless of where the original consultation took place. In practice, achieving this level of interoperability has required hospitals to agree on shared data standards, a process complicated by the fact that many institutions had already invested heavily in their own proprietary software systems before national standardisation efforts began. Doctors who trained during the paper-record era have sometimes found the transition demanding, needing to learn entirely new software interfaces while continuing to see a full patient load, leaving little time for extensive training sessions. Younger medical staff, having grown up with digital technology, generally adapt more quickly, though this can occasionally create friction within hospital departments where senior doctors feel less confident navigating the new systems. Patient privacy has emerged as a central concern throughout this digital transition, since electronic records, if inadequately secured, could expose sensitive health information to unauthorised access on a much larger scale than a single misplaced paper file ever could. Regulatory bodies have responded with strict guidelines governing who can access patient data and under what circumstances, along with mandatory encryption standards for any system storing such records. Despite these hurdles, the benefits have become increasingly apparent over time. Doctors can now cross-reference a patient's prescription history instantly, reducing the risk of dangerous drug interactions that might previously have gone unnoticed. Public health officials, too, have benefited enormously, since aggregated and anonymised electronic records allow them to identify disease outbreaks and treatment patterns far more quickly than was ever possible when such information existed only scattered across countless individual paper files in separate hospital archives.","Remote work arrangements, once considered an unusual perk offered by a handful of progressive technology companies, have become a standard expectation for a significant portion of the professional workforce. This shift has forced organisations to reconsider fundamental assumptions about how teams collaborate, communicate, and measure productivity when employees are no longer sharing the same physical office space. Video conferencing software, which existed for years without achieving widespread adoption, suddenly became an essential daily tool, and companies invested heavily in improving both the reliability and the user experience of these platforms. Beyond the technology itself, managers have had to develop entirely new skills for leading distributed teams, learning to judge performance based on output and deliverables rather than the visible hours an employee spends sitting at a desk. This transition has proven liberating for many workers, particularly those with caregiving responsibilities or long commutes, who report significantly improved work-life balance and job satisfaction since gaining the flexibility to structure their own working hours. Not every role, however, adapts equally well to remote arrangements, and companies have had to think carefully about which positions genuinely benefit from in-person collaboration and which can be performed just as effectively from a home office. Cybersecurity concerns have grown substantially alongside this shift, as employees now regularly access sensitive company systems from home networks that may lack the robust protections standard in a traditional corporate environment. Information technology departments have responded by mandating virtual private networks, multi-factor authentication, and regular security training, recognising that a single compromised home computer could potentially expose an entire organisation's data. Team cohesion presents another persistent challenge, since the casual conversations and spontaneous problem-solving that once happened naturally near a shared coffee machine do not translate easily into a purely digital environment. Forward-thinking companies have experimented with various solutions, from scheduled virtual social events to periodic in-person retreats, attempting to preserve a sense of shared culture and belonging even when team members may be working from entirely different cities or countries throughout most of the year.","Water scarcity has emerged as one of the most pressing infrastructure challenges facing rapidly growing cities, forcing municipal authorities to rethink decades-old approaches to supply and distribution. Many urban water systems were originally designed for populations a fraction of their current size, and ageing pipe networks now lose a substantial percentage of treated water to leaks before it ever reaches a household tap. Detecting these leaks across hundreds of kilometres of underground piping was once an enormously labour-intensive task, requiring crews to physically inspect sections of pipe based on little more than complaint patterns from residents. Modern sensor technology has transformed this process considerably, with smart water meters now capable of detecting unusual flow patterns that indicate a leak long before it becomes visible on the surface, allowing repair crews to be dispatched with far greater precision. Some cities have gone further, installing city-wide monitoring networks that provide real-time data on water pressure and quality across the entire distribution system, enabling engineers to identify problems and even predict likely failure points before they cause a major disruption. Recycling treated wastewater for non-drinking purposes, such as irrigation and industrial cooling, has also gained traction as a practical way to stretch limited freshwater supplies further, though public acceptance of such schemes has sometimes required considerable outreach and education to overcome initial scepticism. Rainwater harvesting, a practice with a long history in many regions, has experienced renewed interest as both a household-level and city-scale strategy, with some municipalities now mandating harvesting systems in new construction to reduce dependence on centralised supply networks. Behavioural change campaigns targeting household consumption have shown mixed but generally positive results, particularly when paired with tiered pricing structures that charge progressively higher rates for water usage beyond a reasonable baseline allowance. Long-term planning remains the most difficult piece of the puzzle, as city planners must balance the immediate needs of a growing population against the reality that climate patterns affecting rainfall and reservoir levels are becoming less predictable than the historical data on which past infrastructure decisions were originally based."],"durationSec":900,"targetKDPH":8000,"targetKeyDepressions":2000},"flashdecks":{"confusable":{"label":"\u2694\ufe0f Confusable Pairs","cards":[{"front":"Virus vs Worm","back":"Virus needs a host file + human action to spread. Worm self-replicates across a network on its own \u2014 no host, no click needed."},{"front":"RAM vs ROM","back":"RAM is volatile (temporary working memory, wiped on power-off). ROM is non-volatile (permanent, holds startup instructions)."},{"front":"LAN vs WAN","back":"LAN = one building/campus. WAN = spans cities/countries \u2014 the Internet is the biggest WAN of all."},{"front":"POP3 vs IMAP","back":"POP3 downloads mail to one device & removes it from the server. IMAP keeps mail on the server & syncs across all your devices."},{"front":"HTTP vs HTTPS","back":"Same protocol, but HTTPS adds SSL/TLS encryption \u2014 that's the padlock icon in your browser."},{"front":"Hub vs Switch","back":"Hub broadcasts data to every port blindly. Switch is smarter \u2014 it sends data only to the intended device."},{"front":"NEFT vs RTGS vs IMPS","back":"NEFT: batch-processed, near real-time. RTGS: instant, one-to-one, for HIGH-VALUE transfers. IMPS: instant, 24\u00d77, smaller amounts."},{"front":"Bit vs Byte","back":"A Bit is a single 0 or 1 \u2014 the smallest unit. A Byte = 8 Bits, roughly one character."},{"front":"Relative vs Absolute cell reference","back":"Relative (A1) shifts when you copy the formula elsewhere. Absolute ($A$1) stays locked in place \u2014 the $ sign anchors it."},{"front":"Transition vs Animation (PowerPoint)","back":"Transition = effect BETWEEN two slides. Animation = effect on an object WITHIN a single slide."},{"front":"System software vs Application software","back":"System software runs the machine itself (the OS). Application software helps YOU do a task (Word, a browser, a game)."},{"front":"CC vs BCC (Email)","back":"CC recipients are visible to everyone. BCC recipients are hidden \u2014 nobody else can see they got a copy."},{"front":"Trojan Horse vs Virus","back":"A Trojan disguises itself as legitimate software and does NOT self-replicate. A virus attaches to files and spreads when the infected file runs."},{"front":"Freeware vs Shareware","back":"Freeware is free indefinitely. Shareware is a free TRIAL \u2014 you're expected to pay after a period."},{"front":"Primary vs Secondary memory","back":"Primary (RAM/ROM/Cache) is directly accessed by the CPU, fast, often volatile. Secondary (HDD/SSD) is for long-term storage, slower, non-volatile."},{"front":"Symmetric vs Asymmetric encryption","back":"Symmetric uses ONE shared key for both encrypting & decrypting. Asymmetric uses a public/private KEY PAIR."},{"front":"Router vs Modem","back":"Modem converts signals between your ISP's line and digital data. Router then directs that data between devices on your network."},{"front":"Firewall vs Antivirus","back":"Firewall filters incoming/outgoing NETWORK traffic by rule. Antivirus scans FILES/programs for known malware."},{"front":"Cache vs RAM","back":"Cache sits even closer to the CPU than RAM, is much smaller, and holds the most recently/frequently used data for near-instant access."},{"front":"URL vs Domain name","back":"A domain name (example.com) is just the address's core. A URL is the FULL path \u2014 protocol + domain + specific page location."}]},"terms":{"label":"\ud83d\udd11 Key Terms","cards":[{"front":"CPU","back":"Central Processing Unit \u2014 the 'brain' of the computer; contains the Control Unit + ALU + Registers."},{"front":"Booting","back":"The process of starting up a computer and loading the Operating System into memory."},{"front":"Firmware","back":"Permanent software programmed into a hardware device's ROM \u2014 e.g. BIOS."},{"front":"Kernel","back":"The core part of an Operating System that manages the system's resources and communication between hardware & software."},{"front":"Cookie","back":"A small piece of data a website stores in your browser to remember information between visits."},{"front":"Cache memory","back":"A very fast, small memory between the CPU and RAM that stores frequently-used data for quick access."},{"front":"Bandwidth","back":"The maximum rate of data transfer across a network connection, usually measured in bits per second."},{"front":"IP Address","back":"A unique numerical label assigned to every device connected to a network, used to identify & locate it."},{"front":"Phishing","back":"A cyber-attack that tricks users into revealing sensitive information via fake emails or websites posing as trustworthy sources."},{"front":"Encryption","back":"Converting readable data into a coded form that can only be read again with the correct decryption key."}]},"protocols":{"label":"\ud83c\udf10 Protocols & Ports","cards":[{"front":"HTTP vs HTTPS","back":"Same protocol for transferring web pages \u2014 HTTPS adds SSL/TLS encryption (the padlock icon)."},{"front":"FTP vs SFTP","back":"FTP transfers files in plain text. SFTP does the same but encrypted & secure."},{"front":"TCP/IP","back":"The foundational protocol suite that makes the entire Internet work \u2014 breaks data into packets and routes them."},{"front":"DNS","back":"Domain Name System \u2014 translates human-readable domain names (example.com) into numeric IP addresses."},{"front":"DHCP","back":"Dynamic Host Configuration Protocol \u2014 automatically assigns an IP address to a device joining a network."},{"front":"USB Type-C","back":"A reversible, modern USB connector found on most new laptops & phones \u2014 replacing Type-A and micro-USB."},{"front":"HDMI","back":"Carries both video AND audio over a single digital cable."},{"front":"VGA","back":"An older analog, video-ONLY port \u2014 no audio."},{"front":"SMTP","back":"Simple Mail Transfer Protocol \u2014 used to SEND outgoing email."},{"front":"IPv4 vs IPv6","back":"IPv4 is 32-bit with a limited address pool. IPv6 is 128-bit, the newer standard with a vastly larger address space."}]},"malware":{"label":"\ud83e\udda0 Malware & Threats","cards":[{"front":"Virus","back":"Attaches itself to a file; needs a host program AND user action (like opening the file) to spread."},{"front":"Worm","back":"Self-replicates across a network completely on its own \u2014 no host file, no user action needed."},{"front":"Trojan Horse","back":"Disguises itself as legitimate software. Unlike a virus, it does NOT self-replicate."},{"front":"Ransomware","back":"Encrypts a victim's files and demands payment (a ransom) to restore access."},{"front":"Spyware","back":"Secretly monitors and reports on a user's activity without their knowledge."},{"front":"Keylogger","back":"A type of spyware that specifically records every keystroke a user types \u2014 including passwords."},{"front":"Phishing","back":"Fraudulent emails/messages designed to trick you into revealing sensitive information."},{"front":"Spoofing","back":"Disguising a communication so it appears to come from a trusted, legitimate source."},{"front":"DoS vs DDoS","back":"DoS floods a system from ONE source. DDoS does the same from MANY sources simultaneously \u2014 much harder to block."},{"front":"Man-in-the-Middle (MitM)","back":"An attacker secretly intercepts (and possibly alters) communication between two parties who believe they're talking directly."}]},"shortcuts":{"label":"\u2328\ufe0f Shortcut Recall","cards":[{"front":"Ctrl + Z","back":"Undo the last action."},{"front":"Ctrl + Shift + Esc","back":"Open Task Manager directly."},{"front":"Windows + E","back":"Open File Explorer."},{"front":"Shift + Delete","back":"Permanently delete a file, skipping the Recycle Bin."},{"front":"F2","back":"Rename the selected file or folder (in Excel: edit the active cell)."},{"front":"Ctrl + H (Word/Excel)","back":"Open Find & Replace."},{"front":"F4 (Excel)","back":"Toggle between relative and absolute cell references while editing a formula."},{"front":"F5 (PowerPoint)","back":"Start the slideshow from the very first slide."},{"front":"Alt + F4","back":"Close the currently active window."},{"front":"Ctrl + Shift + N (Browser)","back":"Open a new Incognito/Private browsing window."}]},"abbr":{"label":"\ud83d\udd24 Abbreviations","cards":[{"front":"CPU","back":"Central Processing Unit"},{"front":"ALU","back":"Arithmetic Logic Unit"},{"front":"CU","back":"Control Unit"},{"front":"RAM","back":"Random Access Memory"},{"front":"ROM","back":"Read Only Memory"},{"front":"BIOS","back":"Basic Input Output System"},{"front":"USB","back":"Universal Serial Bus"},{"front":"HDMI","back":"High-Definition Multimedia Interface"},{"front":"VGA","back":"Video Graphics Array"},{"front":"LAN","back":"Local Area Network"},{"front":"WAN","back":"Wide Area Network"},{"front":"MAN","back":"Metropolitan Area Network"},{"front":"PAN","back":"Personal Area Network"},{"front":"URL","back":"Uniform Resource Locator"},{"front":"HTTP","back":"HyperText Transfer Protocol"},{"front":"HTTPS","back":"HTTP Secure"},{"front":"HTML","back":"HyperText Markup Language"},{"front":"FTP","back":"File Transfer Protocol"},{"front":"TCP/IP","back":"Transmission Control Protocol / Internet Protocol"},{"front":"SMTP","back":"Simple Mail Transfer Protocol"},{"front":"POP3","back":"Post Office Protocol version 3"},{"front":"IMAP","back":"Internet Message Access Protocol"},{"front":"IP","back":"Internet Protocol"},{"front":"ISP","back":"Internet Service Provider"}]}},"formulaLab":{"grid":{"headers":["","A","B","C"],"rows":[["1","Item","Price","Qty"],["2","Pen","10","5"],["3","Book","120","3"],["4","Bag","450","2"],["5","Bottle","80","4"]]},"questions":[{"task":"Add up all the values in the Price column (B2:B5).","accept":["=SUM(B2:B5)"],"hint":"Function name: SUM. Range: B2:B5.","difficulty":"easy"},{"task":"Find the average Price (B2:B5).","accept":["=AVERAGE(B2:B5)"],"hint":"Function name: AVERAGE. Same range as the sum question.","difficulty":"easy"},{"task":"Count how many items have a Quantity greater than 3 (C2:C5).","accept":["=COUNTIF(C2:C5,\">3\")"],"hint":"Function: COUNTIF(range, criteria). Criteria for 'greater than 3' is \">3\" in quotes.","difficulty":"medium"},{"task":"Find the highest Price in B2:B5.","accept":["=MAX(B2:B5)"],"hint":"Function name: MAX.","difficulty":"easy"},{"task":"Find the lowest Price in B2:B5.","accept":["=MIN(B2:B5)"],"hint":"Function name: MIN.","difficulty":"easy"},{"task":"Write a formula that shows \"Expensive\" if B2 is greater than 100, otherwise \"Cheap\".","accept":["=IF(B2>100,\"Expensive\",\"Cheap\")"],"hint":"Structure: =IF(condition, value_if_true, value_if_false).","difficulty":"medium"},{"task":"Multiply Price (B2) by Quantity (C2) to get the total cost of that row.","accept":["=B2*C2"],"hint":"No function needed \u2014 just reference both cells with a multiplication sign.","difficulty":"easy"},{"task":"Write an ABSOLUTE reference to cell B2 (won't shift if the formula is copied elsewhere).","accept":["$B$2"],"hint":"Lock BOTH the column and row with a $ sign before each.","difficulty":"medium"},{"task":"Count how many rows have any data at all in B2:B5.","accept":["=COUNT(B2:B5)"],"hint":"Function name: COUNT (counts numeric cells, no condition needed).","difficulty":"medium"},{"task":"Look up the Price of \"Bag\" from a table A2:C5, returning the 2nd column.","accept":["=VLOOKUP(\"Bag\",A2:C5,2,FALSE)","=VLOOKUP(\"Bag\",A2:C5,2,0)"],"hint":"Structure: =VLOOKUP(lookup_value, table_range, column_index, [exact_match]). Use FALSE or 0 for an exact match.","difficulty":"hard"}]}};

function normalizeFormula(s){

}
function renderFormulaLab(){

  if(flabPool.length===0) flabPool = CONTENT.formulaLab.questions.map((_,i)=>i);
  nextFormula();
}
function nextFormula(){
  const qs = CONTENT.formulaLab.questions;
  if(flabPool.length===0) flabPool = qs.map((_,i)=>i);
  const pickAt = Math.floor(Math.random()*flabPool.length);
  flabIndex = flabPool.splice(pickAt,1)[0];
  const q = qs[flabIndex];
  const area = document.getElementById("flabArea");
  if(!area) return;
  area.innerHTML = `
    <div class="flab-task content-fade">
      <div class="fl-diff"><span class="diff-badge ${q.difficulty}">${q.difficulty}</span></div>
      ${q.task}
    </div>
    <div class="flab-input-row">
      <input class="flab-input" id="flabInput" placeholder="Type the formula, e.g. =SUM(A1:A5)" autocomplete="off" spellcheck="false">
      <button class="flab-btn check" id="flabCheckBtn">Check</button>
      <button class="flab-btn hint" id="flabHintBtn">💡 Hint</button>
    </div>
    <div class="flab-hint-box" id="flabHintBox">${q.hint}</div>
    <div class="flab-feedback" id="flabFeedback"></div>
  `;
  const input = document.getElementById("flabInput");
  input.focus();
  input.addEventListener("keydown", (e)=>{ if(e.key==="Enter") checkFormula(q); });
  document.getElementById("flabCheckBtn").addEventListener("click", ()=>checkFormula(q));
  document.getElementById("flabHintBtn").addEventListener("click", ()=>{
    document.getElementById("flabHintBox").classList.toggle("show");
  });
}
function checkFormula(q){
  const input = document.getElementById("flabInput");
  const typed = normalizeFormula(input.value);
  const correct = q.accept.some(a=>normalizeFormula(a)===typed);
  input.classList.remove("correct","wrong");
  input.classList.add(correct ? "correct" : "wrong");
  if(correct) flabScore.right++; else flabScore.wrong++;
  const scoreRow = winBody.querySelector(".flab-score");
  if(scoreRow){
    scoreRow.children[0].querySelector(".n").textContent = flabScore.right;
    scoreRow.children[1].querySelector(".n").textContent = flabScore.wrong;
  }
  const fb = document.getElementById("flabFeedback");
  fb.classList.add("show", correct?"correct":"wrong");
  fb.innerHTML = correct
    ? `✓ Correct! Accepted form: ${q.accept[0]}`
    : `✗ Not quite. Accepted form: ${q.accept[0]} — try the hint if needed.`;
  document.getElementById("flabInput").insertAdjacentHTML("afterend","");
  if(!document.getElementById("flabNextBtn")){
    fb.insertAdjacentHTML("afterend", `<button class="flab-btn next" id="flabNextBtn">Next question →</button>`);
    document.getElementById("flabNextBtn").addEventListener("click", nextFormula);
  }
}

let destState = null;
let destMode = "exam";      // exam | practice
let destLength = "full";    // full | short
function truncateWords(text, n){
  const words = text.split(" ");
  if(words.length <= n) return text;
  let cut = words.slice(0, n).join(" ");
  const lastDot = cut.lastIndexOf(". ");
  if(lastDot > cut.length * 0.5) cut = cut.slice(0, lastDot+1);
  return cut;
}
function pickPassage(){
  const arr = CONTENT.typing.passages;
  const full = arr[Math.floor(Math.random()*arr.length)];
  return destLength === "short" ? truncateWords(full, 190) : full;
}
function renderTyping(){

  destState = { passage, running:false, startTime:null, keydowns:0,
    remaining: destMode==="exam" ? CONTENT.typing.durationSec : 0,
    timerId:null, finished:false, pasteWarn:false };
  paintTyping();
}
