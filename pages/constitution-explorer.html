<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0a1122">
<title>Constitution of India Explorer</title>
<link rel="icon" type="image/svg+xml" href="../icon.svg?v=2">
<link rel="apple-touch-icon" href="../icon.svg?v=2">
<style>
:root{
  --navy:#0a1122;--navy2:#111b33;--parchment:#0e121a;--parchment2:#171c27;
  --panel:#151a24;--ink:#eae6d9;--muted:#9490a0;--line:#282e3d;
  --saffron:#e08a3f;--saffron-soft:rgba(224,138,63,.14);--saffron-border:rgba(224,138,63,.38);
  --indigo:#8ba0f0;--indigo-soft:rgba(139,160,240,.14);--indigo-border:rgba(139,160,240,.32);
  --green:#4fd19a;--green-soft:rgba(79,209,154,.14);--green-border:rgba(79,209,154,.32);
  --gold:#d3a94c;--shadow:0 14px 38px rgba(0,0,0,.35);--radius:10px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--parchment);color:var(--ink);
  font-family:"Iowan Old Style","Palatino Linotype",Georgia,serif}
body{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
button,input{font:inherit}
button{cursor:pointer}
::selection{background:var(--saffron-soft)}
h1,h2,h3,.serif{font-family:"Source Serif Pro",Georgia,"Iowan Old Style",serif}

.app{display:grid;grid-template-rows:64px 1fr;height:100vh;overflow:hidden}

/* ---------- Top bar ---------- */
.topbar{display:flex;align-items:center;gap:16px;padding:0 20px;background:var(--navy);color:#f4efe0;
  border-bottom:3px solid var(--saffron);z-index:20}
.brand{display:flex;align-items:center;gap:11px;min-width:240px}
.emblem{width:36px;height:36px;border:1.5px solid var(--saffron);border-radius:50%;display:grid;place-items:center;
  color:var(--saffron);font-weight:800;font-size:12px;letter-spacing:.03em;font-family:Inter,sans-serif}
.brand b{font-size:14.5px;letter-spacing:.01em}
.brand span{display:block;color:#c7cbe0;font-size:10.5px;margin-top:1px;letter-spacing:.03em}
.top-crumbs{flex:1;min-width:0;display:flex;align-items:center;gap:6px;font-size:11.5px;color:#c7cbe0;overflow:hidden;white-space:nowrap}
.top-crumbs .c{cursor:pointer}.top-crumbs .c:hover{color:#fff;text-decoration:underline}
.top-crumbs .cur{color:#fff;font-weight:700}
.top-actions{display:flex;gap:8px;flex-shrink:0}
.tbtn{height:36px;border:1px solid rgba(244,239,224,.25);background:rgba(244,239,224,.06);color:#f4efe0;
  border-radius:8px;padding:0 13px;font-size:12px;display:flex;align-items:center;gap:6px;font-family:Inter,sans-serif;font-weight:600}
.tbtn:hover{background:rgba(244,239,224,.14)}
.tbtn.accent{background:var(--saffron);border-color:var(--saffron);color:#fff}
.tbtn.accent:hover{background:#a8530f}
.tbtn.ghost{background:transparent}

/* ---------- Layout ---------- */
.layout{display:grid;grid-template-columns:266px minmax(0,1fr) 296px;min-height:0}
.sidebar,.rightbar{background:var(--panel);min-height:0;overflow:auto;font-family:Inter,sans-serif}
.sidebar{border-right:1px solid var(--line)}
.rightbar{border-left:1px solid var(--line)}
.sb-inner{padding:14px 10px 40px}
.sb-label{font-size:9.5px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:800;padding:14px 10px 6px}
.sb-label:first-child{padding-top:6px}
.nav-btn{width:100%;display:flex;align-items:center;gap:9px;border:0;background:transparent;color:var(--ink);
  padding:8px 10px;border-radius:7px;text-align:left;font-size:12.2px;line-height:1.3}
.nav-btn:hover{background:var(--parchment2)}
.nav-btn.active{background:var(--saffron-soft);color:var(--saffron);font-weight:700}
.nav-num{margin-left:auto;color:var(--muted);font-size:10px;font-weight:400}
.nav-btn.small{font-size:11.4px;color:#b6b1a3;padding:6px 10px 6px 20px}
.nav-btn.small:before{content:"–";margin-right:2px;color:var(--muted)}

/* ---------- Main ---------- */
.main{min-width:0;overflow:auto;padding:26px 34px 70px}
.container{max-width:900px;margin:auto}
.crumbs{display:flex;flex-wrap:wrap;align-items:center;gap:6px;color:var(--muted);font-size:11.5px;margin:0 0 18px;font-family:Inter,sans-serif}
.crumbs .c{cursor:pointer}.crumbs .c:hover{color:var(--saffron);text-decoration:underline}
.crumbs .cur{color:var(--ink);font-weight:700}
.crumbs .sep{color:#c8c2ac}

.hero{border:1px solid var(--line);background:linear-gradient(160deg,var(--panel),var(--parchment2));
  border-radius:14px;padding:26px 28px;box-shadow:var(--shadow);margin-bottom:20px}
.eyebrow{color:var(--saffron);font-weight:800;font-size:10px;text-transform:uppercase;letter-spacing:.11em;font-family:Inter,sans-serif}
.hero h1{font-size:34px;letter-spacing:-.4px;margin:8px 0 8px}
.hero p{color:var(--muted);font-size:13.5px;line-height:1.65;max-width:680px;margin:0;font-family:Inter,sans-serif}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:20px;font-family:Inter,sans-serif}
.stat{border:1px solid var(--line);background:var(--panel);border-radius:9px;padding:12px}
.stat strong{font-size:21px;font-family:"Source Serif Pro",Georgia,serif}
.stat span{display:block;color:var(--muted);font-size:9.5px;margin-top:3px;text-transform:uppercase;letter-spacing:.06em}

.content-head{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;margin:22px 0 12px;font-family:Inter,sans-serif}
.content-head h2{font-size:22px;margin:0;font-family:"Source Serif Pro",Georgia,serif}
.content-head p{margin:5px 0 0;color:var(--muted);font-size:12px}
.actions{display:flex;gap:7px;flex-wrap:wrap}
.small-btn{height:33px;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:7px;
  padding:0 11px;font-size:11.5px;font-family:Inter,sans-serif;font-weight:600;display:flex;align-items:center;gap:5px}
.small-btn:hover{border-color:#3d4152}
.small-btn.primary{background:var(--saffron);border-color:var(--saffron);color:#fff}
.small-btn.saved{color:var(--saffron);border-color:var(--saffron)}

.callout{border-left:3px solid var(--saffron);background:var(--saffron-soft);padding:12px 15px;border-radius:0 8px 8px 0;
  margin:14px 0;font-size:12px;line-height:1.65;font-family:Inter,sans-serif;color:var(--ink)}

.card{border:1px solid var(--line);background:var(--panel);border-radius:11px;padding:17px;margin:11px 0;
  box-shadow:0 1px 3px rgba(28,27,23,.03);font-family:Inter,sans-serif}
.card.clickable{cursor:pointer;transition:transform .08s,border-color .12s}
.card.clickable:hover{border-color:#3d4658;transform:translateY(-1px)}
.article-meta{display:flex;align-items:center;gap:7px;color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.04em}
.article-no{color:var(--saffron);font-weight:900;font-size:11.5px}
.card h3{margin:8px 0;font-size:16px;font-family:"Source Serif Pro",Georgia,serif}
.card p{margin:0;color:#c3bfae;font-size:12.3px;line-height:1.68}
.tagrow{display:flex;gap:5px;flex-wrap:wrap;margin-top:12px}
.tag{border:1px solid var(--line);background:var(--parchment2);color:var(--muted);border-radius:999px;
  padding:4px 9px;font-size:9.5px;cursor:pointer;font-weight:600}
.tag:hover{color:var(--saffron);border-color:var(--saffron-border);background:var(--saffron-soft)}
.badges{display:flex;gap:6px;flex-wrap:wrap;margin-top:11px}
.badge{font-size:9px;border-radius:999px;padding:4px 8px;font-weight:750;border:1px solid var(--line);background:var(--parchment2)}
.badge.imp{color:var(--saffron);background:var(--saffron-soft);border-color:var(--saffron-border)}
.badge.freq{color:var(--indigo);background:var(--indigo-soft);border-color:var(--indigo-border)}
.badge.rec{color:var(--green);background:var(--green-soft);border-color:var(--green-border)}

.quote{font-family:"Source Serif Pro",Georgia,serif;font-size:16.5px;line-height:1.85;padding:19px 21px;
  background:var(--parchment2);border:1px solid var(--line);border-radius:10px;color:var(--ink)}
.clause-list{margin:12px 0 0;padding-left:0;list-style:none;font-family:Inter,sans-serif}
.clause-list li{padding:9px 0 9px 26px;position:relative;font-size:12.5px;color:#c3bfae;line-height:1.6;border-top:1px solid var(--line)}
.clause-list li:first-child{border-top:0}
.clause-list b{color:var(--ink);font-family:"Source Serif Pro",Georgia,serif;margin-right:6px}
.clause-list li:before{content:"§";position:absolute;left:2px;color:var(--saffron);font-weight:700}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;font-family:Inter,sans-serif}
.side-card{border:1px solid var(--line);border-radius:10px;padding:13px;background:var(--panel);margin-bottom:10px;font-family:Inter,sans-serif}
.side-card h4{margin:0 0 10px;font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--navy)}
.side-card p,.side-card li{font-size:11.3px;color:var(--muted);line-height:1.55}
.side-card ul{padding-left:15px;margin:0}
.related{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:7px 0;border-bottom:1px solid var(--line);font-size:11.3px}
.related:last-child{border-bottom:0}
.link{color:var(--indigo);font-weight:700;cursor:pointer;white-space:nowrap}
.link:hover{text-decoration:underline}
.pillset{display:flex;flex-wrap:wrap;gap:5px}
.pill-mini{border:1px solid var(--line);background:var(--parchment2);border-radius:999px;padding:3px 8px;font-size:10px;cursor:pointer;font-weight:600;color:var(--ink)}
.pill-mini:hover{background:var(--saffron-soft);color:var(--saffron);border-color:var(--saffron-border)}

.status{display:inline-flex;align-items:center;gap:5px;font-size:9.5px;font-weight:800;color:var(--green)}
.dot{width:6px;height:6px;border-radius:50%;background:currentColor}

.timeline{position:relative;margin:16px 0;font-family:Inter,sans-serif}
.timeline:before{content:"";position:absolute;left:12px;top:0;bottom:0;width:1px;background:var(--line)}
.event{position:relative;padding:0 0 19px 34px}
.event:before{content:"";position:absolute;left:8px;top:4px;width:9px;height:9px;border:2px solid var(--saffron);background:var(--panel);border-radius:50%}
.event strong{font-size:12.5px;font-family:"Source Serif Pro",Georgia,serif}
.event p{font-size:11.5px;color:var(--muted);margin:4px 0}

.empty{padding:32px;text-align:center;color:var(--muted);font-size:12px;border:1.5px dashed var(--line);border-radius:11px;font-family:Inter,sans-serif}

/* ---------- Search modal ---------- */
.modal-wrap{position:fixed;inset:0;background:rgba(15,29,58,.5);display:none;align-items:flex-start;justify-content:center;
  padding:70px 18px;z-index:60}
.modal-wrap.open{display:flex}
.modal{width:min(740px,100%);background:var(--panel);border:1px solid var(--line);border-radius:14px;
  box-shadow:0 30px 80px rgba(0,0,0,.28);overflow:hidden;font-family:Inter,sans-serif}
.modal-head{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:center;background:var(--parchment2)}
.modal-head input{flex:1;border:0;outline:0;background:transparent;color:var(--ink);font-size:15px}
.modal-head input::placeholder{color:var(--muted)}
.modal-head .mico{color:var(--muted)}
.recent-wrap{padding:12px 16px 8px;border-bottom:1px solid var(--line)}
.recent-title{font-size:9.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:800;margin-bottom:8px}
.pills{display:flex;gap:6px;flex-wrap:wrap}
.recent-pill{border:1px solid var(--line);background:var(--parchment2);border-radius:999px;padding:6px 10px;font-size:10.5px;color:var(--ink);font-weight:600}
.recent-pill:hover{background:var(--saffron-soft);color:var(--saffron)}
.results{max-height:480px;overflow:auto;padding:8px}
.result{padding:11px 13px;border-radius:9px;cursor:pointer}
.result:hover{background:var(--parchment2)}
.result small{color:var(--saffron);font-weight:800;text-transform:uppercase;letter-spacing:.04em;font-size:9.5px}
.result b{display:block;margin:3px 0;font-size:13px;font-family:"Source Serif Pro",Georgia,serif}
.result span{font-size:11px;color:var(--muted)}

#toast{position:fixed;bottom:22px;right:22px;background:var(--navy);color:#fff;padding:11px 15px;border-radius:9px;
  font-size:11.5px;display:none;z-index:80;font-family:Inter,sans-serif;box-shadow:0 8px 20px rgba(0,0,0,.2)}

.mobile-nav{display:none}

/* ---------- Quick Reference table ---------- */
.reftable-wrap{border:1px solid var(--line);border-radius:11px;overflow:hidden;background:var(--panel);font-family:"SFMono-Regular",Consolas,"Liberation Mono",Menlo,monospace}
.reftable{width:100%;border-collapse:collapse;font-size:12px}
.reftable thead th{text-align:left;padding:12px 16px;color:var(--muted);font-size:10px;text-transform:uppercase;
  letter-spacing:.09em;border-bottom:1px solid var(--line);font-weight:700;background:var(--parchment2)}
.reftable tbody td{padding:11px 16px;border-bottom:1px solid var(--line);color:var(--ink);vertical-align:top}
.reftable tbody tr:last-child td{border-bottom:0}
.reftable tbody tr{cursor:pointer}
.reftable tbody tr:hover td{background:var(--saffron-soft)}
.reftable td.rt-art{color:var(--saffron);font-weight:800;white-space:nowrap}
.reftable td.rt-part{color:var(--muted);white-space:nowrap}
.reftable td.rt-topic{color:var(--ink)}
.reftable td.rt-trick{color:#9ea6c4}
.reftable-search{display:flex;align-items:center;gap:9px;margin-bottom:12px}
.reftable-search input{flex:1;height:38px;border:1px solid var(--line);background:var(--panel);color:var(--ink);
  border-radius:8px;padding:0 12px;font-size:12.5px;font-family:Inter,sans-serif}
.reftable-search input::placeholder{color:var(--muted)}
@media(max-width:720px){
  .reftable{font-size:11px}
  .reftable thead th,.reftable tbody td{padding:9px 10px}
  .reftable td.rt-trick{display:none}
  .reftable thead th:last-child{display:none}
}
@media(max-width:1080px){.layout{grid-template-columns:230px minmax(0,1fr)}.rightbar{display:none}.stats{grid-template-columns:repeat(2,1fr)}}
@media(max-width:760px){
  .app{grid-template-rows:58px 1fr}
  .topbar{padding:0 12px;gap:8px}
  .brand span{display:none}.brand b{font-size:12.5px}
  .top-crumbs{display:none}
  .layout{display:block}
  .sidebar{display:none}
  .main{padding:16px 14px 84px}
  .mobile-nav{display:flex;position:fixed;bottom:0;left:0;right:0;background:var(--panel);border-top:1px solid var(--line);
    z-index:20;justify-content:space-around;padding:8px 4px;font-family:Inter,sans-serif}
  .mobile-nav button{background:none;border:0;color:var(--muted);font-size:9px;display:flex;flex-direction:column;align-items:center;gap:3px}
  .mobile-nav button span{font-size:15px}
  .hero h1{font-size:25px}.hero{padding:19px}
  .stats{grid-template-columns:1fr 1fr}
  .grid2{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand">
      <div class="emblem">IN</div>
      <div><b>Constitution Explorer</b><span>Republic of India · Legal Knowledge Base</span></div>
    </div>
    <div class="top-crumbs" id="topCrumbs"></div>
    <div class="top-actions">
      <button class="tbtn accent" onclick="openSearch()">⌕ Search</button>
      <button class="tbtn" onclick="showBookmarks()">☆ Bookmarks <span id="bmCountTop"></span></button>
      <button class="tbtn ghost" title="Close" onclick="toast('Close is a UI placeholder in this build')">✕</button>
    </div>
  </header>

  <div class="layout">
    <aside class="sidebar"><div class="sb-inner" id="sidebarInner"></div></aside>

    <main class="main"><div class="container" id="content"></div></main>

    <aside class="rightbar"><div class="sb-inner" id="rightInner" style="padding-top:16px"></div></aside>
  </div>

  <nav class="mobile-nav">
    <button onclick="showHome()"><span>⌂</span>Home</button>
    <button onclick="showArticlesList()"><span>§</span>Articles</button>
    <button onclick="showPartsList()"><span>◫</span>Parts</button>
    <button onclick="showAmendmentsList()"><span>↻</span>Amend.</button>
    <button onclick="openSearch()"><span>⌕</span>Search</button>
  </nav>
</div>

<div class="modal-wrap" id="searchModal" onclick="if(event.target===this)closeSearch()">
  <div class="modal">
    <div class="modal-head">
      <span class="mico">⌕</span>
      <input id="modalSearch" placeholder="Search article, part, topic, amendment, office, schedule…" oninput="runSearch(this.value)">
      <button class="small-btn" onclick="closeSearch()">Close</button>
    </div>
    <div class="recent-wrap">
      <div class="recent-title">Recent searches · top 5</div>
      <div class="pills" id="recentPills"></div>
    </div>
    <div class="results" id="results"></div>
  </div>
</div>
<div id="toast"></div>

<script>
/* ======================================================================
   DATA LAYER — normalized, relationship-driven.
   NOTE: article "text" fields are plain-language summaries/paraphrases
   produced for this explorer, not the verbatim official text. For the
   authoritative consolidated Constitution, always defer to the
   Legislative Department's official 2026 edition (linked in the footer
   of the Overview page). This dataset is a representative seed — the
   architecture is built so the full corpus can be dropped in later
   without touching the UI.
   ====================================================================== */

const SOURCE_URL = "https://www.legislative.gov.in/documents/constitution-of-india/constitution-of-india-AjN2EjMtQWa?pageTitle=Constitution-of-India";

const PARTS = [
["I","The Union and its Territory","1–4"],
["II","Citizenship","5–11"],
["III","Fundamental Rights","12–35"],
["IV","Directive Principles of State Policy","36–51"],
["IVA","Fundamental Duties","51A"],
["V","The Union","52–151"],
["VI","The States","152–237"],
["VIII","Union Territories","239–242"],
["IX","The Panchayats","243–243O"],
["IXA","The Municipalities","243P–243ZG"],
["IXB","Co-operative Societies","243ZH–243ZT"],
["X","Scheduled and Tribal Areas","244–244A"],
["XI","Relations between the Union and the States","245–263"],
["XII","Finance, Property, Contracts and Suits","264–300A"],
["XIII","Trade, Commerce and Intercourse","301–307"],
["XIV","Services under the Union and the States","308–323"],
["XIVA","Tribunals","323A–323B"],
["XV","Elections","324–329A"],
["XVI","Special Provisions Relating to Certain Classes","330–342A"],
["XVII","Official Language","343–351"],
["XVIII","Emergency Provisions","352–360"],
["XIX","Miscellaneous","361–367"],
["XX","Amendment of the Constitution","368"],
["XXI","Temporary, Transitional and Special Provisions","369–392"],
["XXII","Short Title, Commencement, Authoritative Text in Hindi and Repeals","393–395"]
].map(function(p,i){return {id:i+1,roman:p[0],name:p[1],range:p[2],
  description:"Part "+p[0]+" of the Constitution — "+p[1]+"."}});

const SCHEDULES = [
["1","States and Union territories","Names and territorial extent of the States and Union territories."],
["2","Emoluments, allowances, privileges","Salaries and allowances of the President, Governors, Speaker, judges, CAG and other constitutional offices."],
["3","Forms of oaths and affirmations","Prescribed oaths for the President, Ministers, MPs, MLAs, judges and the CAG."],
["4","Allocation of Rajya Sabha seats","Seat allocation to States and Union territories in the Council of States."],
["5","Administration of Scheduled Areas and Tribes","Special provisions for administration of Scheduled Areas and Scheduled Tribes."],
["6","Administration of Tribal Areas in Assam, etc.","Provisions for tribal areas in Assam, Meghalaya, Tripura and Mizoram."],
["7","Union, State and Concurrent Lists","Distribution of legislative subjects between the Union and the States."],
["8","Recognised languages","The list of languages officially recognised by the Constitution."],
["9","Land reform and related laws","Acts and regulations protected from judicial review on specified grounds."],
["10","Anti-defection provisions","Provisions regarding disqualification of members on grounds of defection."],
["11","Powers of Panchayats","Subjects on which Panchayats may be given powers and responsibilities."],
["12","Powers of Municipalities","Subjects on which Municipalities may be given powers and responsibilities."]
].map(function(s){return {id:parseInt(s[0]),title:s[0]+ordinalSuffix(parseInt(s[0]))+" Schedule",name:s[1],summary:s[2]}});
function ordinalSuffix(n){var s=["th","st","nd","rd"],v=n%100;return (s[(v-20)%10]||s[v]||s[0])}

const AMENDMENTS = [
{no:1,year:1951,name:"Constitution (First Amendment) Act",purpose:"Enabled land reform legislation and added reasonable restrictions on speech; introduced the Ninth Schedule.",
 articles:[15,19,85,87,174,176,341,342,372,376],schedules:[9],added:"Ninth Schedule",modified:"Articles 19, 85, 87",deleted:"—",
 notes:"First major amendment; tested early after the Constitution's commencement over zamindari-abolition litigation."},
{no:7,year:1956,name:"Constitution (Seventh Amendment) Act",purpose:"Gave effect to the States Reorganisation Commission's recommendations, restructuring States on linguistic lines.",
 articles:[1,3,49,80,81,82,131,153,158,168,170,171,216,217,220,222,224,230,231,232,257,363,371,372,378],schedules:[1,2,4],
 added:"Provisions on common High Courts and reorganised States",modified:"Articles 1, 3, 80",deleted:"Part VII (States in Part B) effectively omitted",
 notes:"One of the most structurally significant amendments after the original Constitution."},
{no:24,year:1971,name:"Constitution (Twenty-fourth Amendment) Act",purpose:"Restored and affirmed Parliament's power to amend any part of the Constitution, including Fundamental Rights, reversing the Supreme Court's Golaknath (1967) ruling.",

function esc(v){return String(v==null?"":v).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;")}
function jarg(v){if(typeof v==="number")return String(v);return "'" + String(v).replace(/\\/g,"\\\\").replace(/'/g,"\\'") + "'"}
function byArticle(n){return ARTICLES.find(function(a){return String(a.n)===String(n)})}
function byPartRoman(r){return PARTS.find(function(p){return p.roman===r})}
function byAmendNo(n){return AMENDMENTS.find(function(a){return a.no===parseInt(n)})}
function bySchedule(n){return SCHEDULES.find(function(s){return s.id===parseInt(n)})}

/* localStorage helpers */
function lsGet(key){try{return JSON.parse(localStorage.getItem(key)||"[]")}catch(e){return []}}
function lsSet(key,val){localStorage.setItem(key,JSON.stringify(val))}
function recent(){return lsGet("ce_recent")}
function saveRecent(q){q=String(q||"").trim();if(!q)return;var a=recent();a=[q].concat(a.filter(function(x){return x.toLowerCase()!==q.toLowerCase()})).slice(0,5);lsSet("ce_recent",a)}
function bookmarks(){return lsGet("ce_bookmarks")}
function isBookmarked(n){return bookmarks().some(function(x){return String(x)===String(n)})}
function toggleBookmark(n){
 var a=bookmarks(),i=a.findIndex(function(x){return String(x)===String(n)});
 if(i>=0)a.splice(i,1);else a.unshift(n);
 lsSet("ce_bookmarks",a);
 updateBookmarkCount();
 toast(i>=0?"Bookmark removed":"Article bookmarked");
}
function updateBookmarkCount(){
 var c=bookmarks().length;
 document.getElementById("bmCountTop").textContent=c?("("+c+")"):"";
}

/* navigation trail for breadcrumbs */
var TRAIL=[{label:"Overview",fn:"showHome()"}];
function pushTrail(label,fn){TRAIL.push({label:label,fn:fn});if(TRAIL.length>5)TRAIL=[TRAIL[0]].concat(TRAIL.slice(-4));renderCrumbs()}
function resetTrail(label,fn){TRAIL=[{label:label,fn:fn}];renderCrumbs()}
function renderCrumbs(){
 var html="";
 TRAIL.forEach(function(t,i){
  var last=i===TRAIL.length-1;
  html+='<span class="'+(last?"cur":"c")+'"'+(last?"":' onclick="'+t.fn+'"')+'>'+esc(t.label)+'</span>';
  if(!last)html+='<span class="sep">›</span>';
 });
 document.getElementById("topCrumbs").innerHTML=html;
 document.querySelectorAll("#content .crumbs").forEach(function(el){el.innerHTML=html.replace(/class="c"/g,'class="c"')});
}
function crumbBar(){
 var html='<div class="crumbs">';
 TRAIL.forEach(function(t,i){
  var last=i===TRAIL.length-1;
  html+='<span class="'+(last?"cur":"c")+'"'+(last?"":' onclick="'+t.fn+'"')+'>'+esc(t.label)+'</span>';
  if(!last)html+='<span class="sep">›</span>';
 });
 return html+'</div>';
}

function setNav(key){

}

function render(html){document.getElementById("content").innerHTML=crumbBar()+html;renderCrumbs()}

var STOPWORDS={"and":1,"of":1,"the":1,"in":1,"for":1,"to":1,"a":1,"&":1};
function tokens(s){
 return String(s).toLowerCase().replace(/[\/&]/g," ").split(/[\s,]+/).filter(function(w){return w&&!STOPWORDS[w]});
}
function articleHaystack(a){
 return [a.title,a.chapter,"part "+a.part].concat(a.keywords||[],a.bodies||[],a.offices||[]).join(" ").toLowerCase();
}
function hasWord(hay,tok){
 if(tok.length<4){
  var re=new RegExp("(^|[^a-z0-9])"+tok.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+"($|[^a-z0-9])");
  return re.test(hay);
 }
 return hay.indexOf(tok)>=0;
}
function topicMatch(article,queryTerms){
 var hay=articleHaystack(article);
 return queryTerms.some(function(term){
  var termTokens=tokens(term);
  if(!termTokens.length)return false;
  return termTokens.every(function(tok){return hasWord(hay,tok)});
 });
}
function topic(t,el){
 setNav(null); pushTrail(t,"topic("+jarg(t)+")");
 var terms=[t].concat(CATEGORY_ALIASES[t]||[]);
 var list=ARTICLES.filter(function(a){return a.explanation && topicMatch(a,terms)});
 var html='<div class="content-head"><div><div class="eyebrow">Constitutional Category</div><h2>'+esc(t)+'</h2><p>Every article in the reading dataset connected to this subject, matched by tag, office, body and chapter.</p></div></div>';
 if(!list.length){
  html+='<div class="empty">No articles are linked to <b>'+esc(t)+'</b> in the current reading dataset yet. The category is indexed and will populate automatically as matching articles are added to the data layer.</div>';
  html+='<div class="content-head"><div><h2>Related categories to try</h2></div></div><div class="card"><div class="pillset">'+
   TOPIC_CATEGORIES.slice(0,10).map(function(c){return '<span class="pill-mini" onclick="topic('+jarg(c)+')">'+esc(c)+'</span>'}).join("")+'</div></div>';
 } else {
  html+=articleCards(list);
 }
 render(html); renderRight(null);
}

  html+='<div class="side-card"><h4>Quick summary</h4><p>'+esc(a.summary)+'</p></div>';
  html+='<div class="side-card"><h4>Related articles</h4>'+
   ((a.related||[]).length?(a.related.slice(0,8).map(function(r){return '<div class="related"><span>Article '+esc(r)+'</span><span class="link" onclick="showArticle('+jarg(r)+')">Open</span></div>'}).join("")):'<p>None recorded.</p>')+'</div>';
  html+='<div class="side-card"><h4>Related part</h4><p><span class="link" onclick="showPart('+jarg(a.part)+')">Part '+esc(a.part)+'</span></p></div>';
  if((a.schedules||[]).length)html+='<div class="side-card"><h4>Related schedules</h4><div class="pillset">'+a.schedules.map(function(s){return '<span class="pill-mini" onclick="showSchedule('+s+')">Schedule '+s+'</span>'}).join("")+'</div></div>';
  if((a.bodies||[]).length||(a.offices||[]).length)html+='<div class="side-card"><h4>Related bodies / offices</h4><div class="pillset">'+
   (a.bodies||[]).concat(a.offices||[]).map(function(b){return '<span class="pill-mini" onclick="topic(\''+esc(b).replace(/'/g,"\\'")+'\')">'+esc(b)+'</span>'}).join("")+'</div></div>';
  if((a.amendments||[]).length)html+='<div class="side-card"><h4>Related amendments</h4>'+
   a.amendments.map(function(no){var am=byAmendNo(no);return '<div class="related"><span>'+no+ordinalSuffix(no)+' Amendment</span>'+(am?'<span class="link" onclick="showAmendment('+no+')">Open</span>':'')+'</div>'}).join("")+'</div>';
 } else {
  html+='<div class="side-card"><h4>For SSC aspirants</h4><p>Every article is tagged with <b>Importance</b>, <b>SSC frequency</b> and <b>Recency</b> to speed up revision-oriented browsing.</p></div>';
  html+='<div class="side-card"><h4>Navigation</h4><p>Every relationship shown on this page — articles, parts, topics, amendments, schedules and breadcrumbs — is clickable.</p></div>';
 }
 document.getElementById("rightInner").innerHTML=html;
}

/* ======================================================================
   SEARCH
   ====================================================================== */
function openSearch(){
 document.getElementById("searchModal").classList.add("open");
 renderRecentPills();
 var input=document.getElementById("modalSearch");input.value="";runSearch("");
 setTimeout(function(){input.focus()},40);
}
function closeSearch(){document.getElementById("searchModal").classList.remove("open")}
function renderRecentPills(){
 var arr=recent(),box=document.getElementById("recentPills");
 box.innerHTML=arr.length?arr.map(function(q){return '<button class="recent-pill" onclick="searchFromPill('+jarg(q)+')">'+esc(q)+'</button>'}).join(""):'<span style="font-size:10.5px;color:var(--muted)">No recent searches yet.</span>';
}
function searchFromPill(q){document.getElementById("modalSearch").value=q;runSearch(q)}
function allSearchRecords(){
 var all=[];
 ARTICLES.forEach(function(a){if(a.explanation)all.push({type:"Article "+a.n,title:a.title,text:a.summary,fn:function(){showArticle(a.n)}})});
 PARTS.forEach(function(p){all.push({type:"Part "+p.roman,title:p.name,text:"Articles "+p.range,fn:function(){showPart(p.roman)}})});
 SCHEDULES.forEach(function(s){all.push({type:s.title,title:s.name,text:s.summary,fn:function(){showSchedule(s.id)}})});
 AMENDMENTS.forEach(function(a){all.push({type:a.no+ordinalSuffix(a.no)+" Amendment",title:a.name,text:a.year+" · "+a.purpose,fn:function(){showAmendment(a.no)}})});
 TOPIC_CATEGORIES.forEach(function(t){all.push({type:"Category",title:t,text:"Browse articles related to "+t,fn:function(){topic(t)}})});
 return all;
}
function runSearch(q){
 q=String(q||"").trim();
 var records=allSearchRecords();
 var hit=q?records.filter(function(x){return (x.type+" "+x.title+" "+x.text).toLowerCase().indexOf(q.toLowerCase())>=0}).slice(0,24)
  :records.filter(function(x){return x.type.indexOf("Article")===0}).slice(0,10);
 var html="";
 if(!q)html='<div class="empty">Search by article number, part, topic, amendment, office, schedule or concept.</div>';
 else if(!hit.length)html='<div class="empty">No matching constitutional records.</div>';
 else hit.forEach(function(x,i){html+='<div class="result" data-i="'+i+'"><small>'+esc(x.type)+'</small><b>'+esc(x.title)+'</b><span>'+esc(x.text)+'</span></div>'});
 document.getElementById("results").innerHTML=html;
 document.querySelectorAll("[data-i]").forEach(function(node){
  var i=parseInt(node.getAttribute("data-i"));
  node.onclick=function(){saveRecent(q);closeSearch();hit[i].fn();renderRecentPills()};
 });
}

/* ======================================================================
   MISC
   ====================================================================== */
function toast(t){
 var x=document.getElementById("toast");x.textContent=t;x.style.display="block";
 clearTimeout(window.__ceToast);window.__ceToast=setTimeout(function(){x.style.display="none"},1900);
}

buildSidebar();
showHome();

/* ---- close to dashboard (fullscreen overlay) ---- */
function doExit(){
  try{ window.parent.postMessage({ type:"closeFullscreen" }, "*"); }
  catch(e){ window.close(); }
}
window.addEventListener("keydown", function(e){
  var t=e.target;
  if(t && (t.tagName==="INPUT"||t.tagName==="TEXTAREA"||t.isContentEditable)) return;
  if(e.key==="b" || e.key==="B"){ e.preventDefault(); doExit(); }
});
document.querySelectorAll(".topbar .tbtn.ghost").forEach(function(btn){
  btn.title="Close (B)";
  btn.onclick=doExit;
});
</script>
