<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Geometry &amp; Mensuration Atlas — SSC CGL &amp; CHSL</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
:root{
  --bg:#05080d;
  --bg-alt:#0a1119;
  --panel:rgba(16,24,36,0.72);
  --panel-solid:#0d1520;
  --line:rgba(148,175,199,0.14);
  --line-strong:rgba(148,175,199,0.28);
  --text:#e7edf3;
  --text-dim:#8ea0b3;
  --text-faint:#546274;
  --accent:#19c37d;
  --accent-dim:#0f7a52;
  --cyan:#22d3ee;
  --amber:#f0a839;
  --purple:#a78bfa;
  --red:#f0554d;
  --rose:#ea5757;
  --mono: ui-monospace, 'SFMono-Regular', 'JetBrains Mono', Menlo, Consolas, monospace;
  --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, Helvetica, Arial, sans-serif;
  --radius: 10px;
}
*{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
html,body{height:100%;}
body{
  margin:0;
  background:
    radial-gradient(ellipse 900px 500px at 18% -8%, rgba(25,195,125,0.12), transparent 60%),
    radial-gradient(ellipse 900px 600px at 100% 10%, rgba(34,211,238,0.10), transparent 55%),
    var(--bg);
  color:var(--text);
  font-family:var(--sans);
  overflow:hidden;
  height:100vh;
}
::selection{background:rgba(25,195,125,0.35);}
::-webkit-scrollbar{width:7px; height:7px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--line-strong); border-radius:8px;}

.app{
  display:grid;
  grid-template-rows: 56px 1fr;
  grid-template-columns: 270px 1fr;
  grid-template-areas:
    "top top"
    "side main";
  height:100vh;
  gap:1px;
  background:var(--line);
}
.app > *{background:var(--bg);}

/* TOPBAR */
.topbar{
  grid-area:top;
  display:flex; align-items:center; gap:14px;
  padding:0 18px;
  background:linear-gradient(180deg, var(--bg-alt), var(--bg));
  border-bottom:1px solid var(--line);
}
.brand{
  display:flex; align-items:center; gap:9px;
  font-family:var(--mono);
  font-size:14px;
  letter-spacing:0.5px;
  color:var(--text);
  white-space:nowrap;
}
.brand .dot{
  width:9px; height:9px; border-radius:50%;
  background:var(--accent);
  box-shadow:0 0 10px 2px rgba(25,195,125,0.7);
  animation: pulse 2.4s ease-in-out infinite;
}
@keyframes pulse{0%,100%{opacity:1; transform:scale(1);} 50%{opacity:0.5; transform:scale(0.75);}}

.nav-tabs{
  display:flex; gap:4px; flex-wrap:nowrap; overflow-x:auto;
  background:rgba(255,255,255,0.03);
  border:1px solid var(--line);
  border-radius:999px;
  padding:3px;
  scrollbar-width:none;
}
.nav-tabs::-webkit-scrollbar{display:none;}
.nav-tab{
  border:none; background:transparent; color:var(--text-dim);
  font-family:var(--mono); font-size:10.5px; letter-spacing:0.5px;
  padding:6px 12px; border-radius:999px; cursor:pointer;
  transition: all .18s ease; text-transform:uppercase; white-space:nowrap;
  display:flex; align-items:center; gap:6px;
}
.nav-tab:hover{color:var(--text); background:rgba(255,255,255,0.05);}
.nav-tab.active{background:var(--cyan); color:#04140c; font-weight:700; box-shadow:0 0 12px rgba(34,211,238,0.3);}

.search-wrap{position:relative; flex:1; max-width:280px; margin-left:auto;}
.search-wrap input{
  width:100%; background:rgba(255,255,255,0.04); border:1px solid var(--line);
  color:var(--text); padding:7px 12px 7px 32px; border-radius:8px;
  font-family:var(--sans); font-size:12.5px; outline:none; transition:border-color .15s;
}
.search-wrap input:focus{border-color:var(--accent);}
.search-wrap svg{position:absolute; left:10px; top:50%; transform:translateY(-50%); width:14px; height:14px; color:var(--text-faint); pointer-events:none;}
.search-results{
  position:absolute; top:calc(100%+6px); left:0; right:0;
  background:var(--panel-solid); border:1px solid var(--line-strong); border-radius:8px;
  max-height:400px; overflow-y:auto; z-index:60; box-shadow:0 20px 40px rgba(0,0,0,0.6); display:none;
}
.search-results.show{display:block;}
.search-item{padding:9px 12px; cursor:pointer; display:flex; align-items:center; gap:8px; border-bottom:1px solid var(--line); font-size:12px;}
.search-item:last-child{border-bottom:none;}
.search-item:hover{background:rgba(255,255,255,0.06);}
.search-item .tag{font-family:var(--mono); font-size:9px; padding:2px 6px; border-radius:4px; background:rgba(255,255,255,0.06); color:var(--text-faint); text-transform:uppercase;}

.close-btn{
  display:flex; align-items:center; justify-content:center; width:32px; height:32px;
  border-radius:8px; background:rgba(255,255,255,0.04); border:1px solid var(--line);
  color:var(--text-dim); cursor:pointer; transition:all .15s; flex-shrink:0;
}
.close-btn:hover{border-color:var(--accent); color:var(--accent); background:rgba(255,255,255,0.08);}

/* SIDEBAR */
.sidebar{
  grid-area:side; background:var(--bg-alt); border-right:1px solid var(--line);
  overflow-y:auto; padding:14px 12px; display:flex; flex-direction:column; gap:14px;
}
.side-header{display:flex; align-items:center; justify-content:space-between; margin-bottom:6px;}
.side-header h4{font-family:var(--mono); font-size:11px; letter-spacing:1px; text-transform:uppercase; color:var(--cyan); margin:0; font-weight:700;}
.side-count{font-family:var(--mono); font-size:10px; color:var(--text-faint); background:rgba(255,255,255,0.05); padding:2px 6px; border-radius:4px;}
.shape-list{display:flex; flex-direction:column; gap:3px;}
.shape-item{
  padding:8px 10px; border-radius:7px; cursor:pointer; font-size:12.5px;
  color:var(--text-dim); display:flex; align-items:center; gap:9px;
  transition:all .12s ease; border:1px solid transparent;
}
.shape-item:hover{background:rgba(255,255,255,0.04); color:var(--text); transform:translateX(2px);}
.shape-item.active{background:rgba(34,211,238,0.1); border-color:rgba(34,211,238,0.3); color:var(--cyan); font-weight:600;}
.shape-item .icon{width:20px; text-align:center; font-size:13px; flex-shrink:0;}
.shape-item .name{flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.shape-item .badge-mini{font-family:var(--mono); font-size:8px; padding:1px 4px; border-radius:3px; background:rgba(240,168,57,0.15); color:var(--amber); font-weight:600;}

.reset-btn{
  margin-top:auto; background:rgba(255,255,255,0.04); border:1px solid var(--line);
  color:var(--text-dim); font-family:var(--mono); font-size:10.5px; padding:9px; border-radius:8px;
  cursor:pointer; letter-spacing:0.5px; text-transform:uppercase; transition:.15s; width:100%;
}
.reset-btn:hover{border-color:var(--accent); color:var(--accent); background:rgba(25,195,125,0.08);}

/* MAIN CONTENT CONTAINER - FULL REMAINING WIDTH */
.main{
  grid-area:main; overflow-y:auto; padding:24px 36px 80px; width:100%; max-width:100%;
}

/* CARDS & UI COMPONENTS */
.card-header-bar{display:flex; align-items:flex-start; justify-content:space-between; gap:16px; margin-bottom:16px;}
.card-eyebrow{font-family:var(--mono); font-size:10.5px; letter-spacing:1.2px; text-transform:uppercase; color:var(--cyan); margin-bottom:4px; display:flex; align-items:center; gap:8px;}
.card-title{font-size:28px; font-weight:800; margin:0 0 6px 0; letter-spacing:-0.4px; line-height:1.2;}
.card-sub{font-size:13px; color:var(--text-dim); font-family:var(--mono); line-height:1.5; max-width:900px;}

.badge{display:inline-block; font-size:9.5px; padding:3px 8px; border-radius:5px; text-transform:uppercase; letter-spacing:0.5px; font-family:var(--mono); font-weight:700;}
.badge.easy{background:rgba(25,195,125,0.12); color:var(--accent); border:1px solid rgba(25,195,125,0.3);}
.badge.medium{background:rgba(240,168,57,0.12); color:var(--amber); border:1px solid rgba(240,168,57,0.3);}
.badge.hard{background:rgba(240,85,77,0.12); color:var(--red); border:1px solid rgba(240,85,77,0.3);}

.section-h{
  font-family:var(--mono); font-size:11px; letter-spacing:1px;
  text-transform:uppercase; color:var(--text-faint); margin:26px 0 12px 0;
  padding-top:14px; border-top:1px solid var(--line); display:flex; align-items:center; gap:8px;
}
.section-h:first-of-type{border-top:none; padding-top:0; margin-top:0;}

/* DIAGRAM BOX & CUT CONTROLS */
.diagram-container{margin:16px 0 24px;}
.slice-bar{
  display:flex; gap:6px; margin-bottom:8px; justify-content:center;
}
.slice-btn{
  background:rgba(255,255,255,0.04); border:1px solid var(--line); color:var(--text-dim);
  font-family:var(--mono); font-size:10px; padding:4px 10px; border-radius:6px; cursor:pointer; transition:.15s;
}
.slice-btn:hover{color:var(--text); border-color:var(--cyan);}
.slice-btn.active{background:rgba(34,211,238,0.15); color:var(--cyan); border-color:var(--cyan); font-weight:600;}

.diagram-box{
  background:linear-gradient(135deg, rgba(16,24,36,0.85), rgba(10,17,25,0.95));
  border:1px solid var(--line-strong); border-radius:14px;
  padding:20px; text-align:center; min-height:240px;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  box-shadow:0 12px 30px rgba(0,0,0,0.4); position:relative; overflow:hidden;
}
.diagram-box::before{
  content:''; position:absolute; top:0; left:0; right:0; height:1px;
  background:linear-gradient(90deg, transparent, var(--cyan), transparent); opacity:0.4;
}
.diagram-box svg{max-width:100%; height:auto; max-height:260px; filter:drop-shadow(0 4px 12px rgba(0,0,0,0.5));}

/* TABLES & GRIDS */
.formula-table{width:100%; border-collapse:collapse; font-size:12.5px; font-family:var(--mono); margin:10px 0;}
.formula-table th{text-align:left; color:var(--text-dim); font-weight:700; padding:9px 12px; font-size:10.5px; text-transform:uppercase; letter-spacing:0.6px; border-bottom:2px solid var(--line-strong); background:rgba(255,255,255,0.02);}
.formula-table td{padding:9px 12px; border-bottom:1px solid var(--line); vertical-align:middle;}
.formula-table tr:hover td{background:rgba(255,255,255,0.03);}
.formula-table .formula{font-family:var(--mono); font-size:13.5px; color:var(--cyan); font-weight:600;}
.formula-table .var{font-style:italic; color:var(--amber); font-weight:600;}

.props-grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(260px, 1fr)); gap:10px; margin:10px 0;}
.prop-item{
  background:rgba(255,255,255,0.03); border:1px solid var(--line); border-radius:8px;
  padding:10px 12px; font-size:12.5px; color:var(--text-dim); display:flex; align-items:flex-start; gap:9px; line-height:1.5;
}
.prop-item:before{content:'✓'; color:var(--accent); font-weight:700; font-size:12px; margin-top:1px; flex-shrink:0;}

.info-grid{display:grid; grid-template-columns:repeat(auto-fit, minmax(180px, 1fr)); gap:12px; margin:10px 0;}
.info-cell{background:rgba(255,255,255,0.03); border:1px solid var(--line); border-radius:9px; padding:10px 12px;}
.info-cell label{display:block; font-family:var(--mono); font-size:9.5px; color:var(--text-faint); text-transform:uppercase; letter-spacing:0.6px; margin-bottom:4px;}
.info-cell .val{font-size:13.5px; color:var(--text); font-weight:600; line-height:1.4;}
.info-cell .desc{font-size:11px; color:var(--text-dim); margin-top:2px; line-height:1.3;}

/* LIVE CALCULATOR */
.calculator{
  background:linear-gradient(180deg, var(--panel-solid), rgba(13,21,32,0.7));
  border:1px solid var(--line-strong); border-radius:12px; padding:18px 20px; margin:16px 0;
  box-shadow:0 8px 24px rgba(0,0,0,0.3);
}
.calc-formula{font-family:var(--mono); font-size:13px; color:var(--cyan); margin-bottom:16px; text-align:center; font-weight:700;}
.calc-formula .var{color:var(--amber);}
.calc-grid{display:grid; grid-template-columns:repeat(auto-fit, minmax(140px, 1fr)); gap:14px; margin-bottom:16px;}
.calc-field{display:flex; flex-direction:column; gap:5px;}
.calc-field label{font-family:var(--mono); font-size:9.5px; color:var(--text-faint); text-transform:uppercase; letter-spacing:0.5px;}
.calc-field input{
  padding:8px 12px; border:1px solid var(--line-strong); border-radius:7px;
  background:rgba(255,255,255,0.05); color:var(--text); font-family:var(--mono); font-size:13px; outline:none; transition:border-color .15s;
}
.calc-field input:focus{border-color:var(--accent); background:rgba(255,255,255,0.08);}

/* RELATED CONCEPTS ACCORDION */
.related-accordion{display:flex; flex-direction:column; gap:8px; margin:10px 0 20px;}
.acc-item{
  background:rgba(255,255,255,0.025); border:1px solid var(--line); border-radius:10px; overflow:hidden;
  transition: border-color .15s;
}
.acc-item.open{border-color:var(--line-strong);}
.acc-head{
  display:flex; align-items:center; gap:11px; padding:13px 15px; cursor:pointer; user-select:none;
}
.acc-head:hover{background:rgba(255,255,255,0.03);}
.acc-icon{font-size:17px; width:22px; text-align:center; flex-shrink:0;}
.acc-title{font-size:13.5px; font-weight:700; color:var(--text); flex-shrink:0;}
.acc-sub{font-size:11.5px; color:var(--text-faint); flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.acc-chev{font-size:11px; color:var(--text-faint); transition:transform .2s; flex-shrink:0;}
.acc-item.open .acc-chev{transform:rotate(180deg);}
.acc-body{
  max-height:0; overflow:hidden; transition:max-height .3s ease; padding:0 15px;
}
.acc-item.open .acc-body{max-height:900px; padding:0 15px 16px;}
.acc-diagram{background:rgba(0,0,0,0.15); border-radius:8px; padding:6px; margin-top:2px;}
.acc-diagram svg{width:100%; height:auto; display:block; max-height:160px;}
.calc-result{
  background:rgba(25,195,125,0.08); border:1px solid rgba(25,195,125,0.3); border-radius:9px; padding:14px; text-align:center; margin-top:14px;
}
.calc-result .label{font-family:var(--mono); font-size:9.5px; color:var(--text-faint); text-transform:uppercase; letter-spacing:0.8px;}
.calc-result .value{font-size:22px; font-weight:800; color:var(--accent); font-family:var(--mono); margin-top:4px;}

/* NOTES & CALLOUTS */
.note-card{
  background:rgba(240,168,57,0.06); border:1px solid rgba(240,168,57,0.22); border-radius:9px;
  padding:12px 14px; font-size:13px; line-height:1.6; color:var(--text-dim); margin:10px 0; position:relative; padding-left:34px;
}
.note-card:before{content:'★'; position:absolute; left:12px; top:12px; color:var(--amber); font-size:13px;}

.mistake-card{
  background:rgba(240,85,77,0.08); border-left:3px solid var(--red); border-radius:0 9px 9px 0;
  padding:11px 14px; font-size:13px; color:var(--text-dim); margin:10px 0; line-height:1.5;
}
.mistake-card b{color:var(--red);}

.mnemonic{
  background:rgba(167,139,250,0.08); border:1px solid rgba(167,139,250,0.25); border-radius:9px;
  padding:12px 16px; font-size:13px; margin:10px 0; font-style:italic; color:var(--text-dim); line-height:1.5;
}
.mnemonic b{color:var(--purple); font-style:normal;}

/* COMPARISON MODE STYLES */
.compare-grid{display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-top:16px;}
.compare-card{background:var(--panel-solid); border:1px solid var(--line-strong); border-radius:12px; padding:16px;}
.compare-select{
  width:100%; padding:8px 12px; border-radius:7px; background:rgba(255,255,255,0.05);
  border:1px solid var(--line-strong); color:var(--text); font-family:var(--mono); font-size:12.5px; margin-bottom:14px; outline:none;
}
.compare-select option{background:#0d1520; color:#fff;}
.ratio-banner{
  background:rgba(34,211,238,0.08); border:1px solid rgba(34,211,238,0.3); border-radius:10px;
  padding:14px 18px; margin:16px 0; text-align:center; font-family:var(--mono);
}
.ratio-banner .r-title{font-size:11px; text-transform:uppercase; color:var(--text-faint); letter-spacing:1px;}
.ratio-banner .r-val{font-size:20px; font-weight:800; color:var(--cyan); margin-top:4px;}

/* QUIZ & FLASHCARD STYLES */
.quiz-box{background:var(--panel-solid); border:1px solid var(--line-strong); border-radius:12px; padding:20px; margin-top:16px;}
.quiz-options{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin:16px 0;}
.quiz-opt{
  padding:12px 14px; border-radius:8px; background:rgba(255,255,255,0.03); border:1px solid var(--line);
  color:var(--text); font-family:var(--mono); font-size:13px; text-align:left; cursor:pointer; transition:all .15s;
}
.quiz-opt:hover{background:rgba(255,255,255,0.07); border-color:var(--cyan);}
.quiz-opt.correct{background:rgba(25,195,125,0.15) !important; border-color:var(--accent) !important; color:var(--accent); font-weight:700;}
.quiz-opt.wrong{background:rgba(240,85,77,0.15) !important; border-color:var(--red) !important; color:var(--red);}

@media (max-width:980px){
  .app{grid-template-columns:1fr; grid-template-areas:"top""main"; grid-template-rows:auto 1fr;}
  .sidebar{display:none;}
  .main{padding:18px;}
  .compare-grid{grid-template-columns:1fr;}
  .quiz-options{grid-template-columns:1fr;}
}
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <div class="brand">
      <span class="dot"></span>
      <span>GEOMETRY ATLAS</span>
    </div>
    <nav class="nav-tabs" id="navTabs">
      <button class="nav-tab active" data-tab="fundamentals"><i class="fa-solid fa-circle-dot"></i> Fundamentals</button>
      <button class="nav-tab" data-tab="2d"><i class="fa-solid fa-shapes"></i> 2D Shapes</button>
      <button class="nav-tab" data-tab="3d"><i class="fa-solid fa-cube"></i> 3D Solids</button>
      <button class="nav-tab" data-tab="coordinate"><i class="fa-solid fa-chart-line"></i> Coordinate Geometry</button>
      <button class="nav-tab" data-tab="trigonometry"><i class="fa-solid fa-calculator"></i> Trigonometry</button>
      <button class="nav-tab" data-tab="theorems"><i class="fa-solid fa-graduation-cap"></i> Theorems Index</button>
    </nav>
    <div class="search-wrap">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input id="searchInput" type="text" placeholder="Search shapes, formulas, tangents..." autocomplete="off">
      <div class="search-results" id="searchResults"></div>
    </div>
    <button id="atlasCloseBtn" class="close-btn" title="Close Atlas (B)">
      <i class="fa-solid fa-xmark text-lg"></i>
    </button>
  </div>
  <div class="sidebar" id="sidebar">
    <div class="side-header">
      <h4 id="sidebarTitle">2D Shapes</h4>
      <span class="side-count" id="sidebarCount">26 items</span>
    </div>
    <div class="shape-list" id="shapeList"></div>
    <button class="reset-btn" id="resetBtn">↺ Reset View</button>
  </div>
  <div class="main" id="mainContent">
    <!-- Main content rendered dynamically -->
  </div>
</div>

<script>
(function(){
"use strict";

// ====================
// HIGH-FREQUENCY SSC CGL SHAPES ORDERED BY FREQUENCY
// ====================

const FUNDAMENTALS = [
  {id:"point", name:"Point (Dot)", icon:"•", color:"#22d3ee", group:"fundamentals", star:true},
  {id:"line", name:"Line", icon:"—", color:"#22d3ee", group:"fundamentals", star:true},
  {id:"ray", name:"Ray", icon:"→", color:"#22d3ee", group:"fundamentals", star:true},
  {id:"line-segment", name:"Line Segment", icon:"⎯", color:"#22d3ee", group:"fundamentals", star:true},
  {id:"angle-types", name:"Angle & Its Types", icon:"∠", color:"#f0a839", group:"fundamentals", star:true},
  {id:"parallel-transversal", name:"Parallel Lines & Transversal", icon:"∥", color:"#a78bfa", group:"fundamentals", star:true}
];

const SHAPES_2D = [
  {id:"circle", name:"Circle Basics", icon:"○", color:"#22d3ee", group:"2d", star:true},
  {id:"equilateral-triangle", name:"Equilateral Triangle", icon:"△", color:"#f0a839", group:"2d", star:true},
  {id:"right-triangle", name:"Right Triangle & Triples", icon:"△", color:"#f0a839", group:"2d", star:true},
  {id:"rhombus", name:"Rhombus & Diagonals", icon:"◊", color:"#a78bfa", group:"2d", star:true},
  {id:"trapezium", name:"Trapezium & Midline", icon:"⌕", color:"#a78bfa", group:"2d", star:true},

// ====================
// RENDER CONTROLLER
// ====================

var activeShape = null, activeTab = "2d", currentSliceMode = "default";

function renderSidebar() {
  var title = document.getElementById("sidebarTitle");
  var count = document.getElementById("sidebarCount");
  var list = document.getElementById("shapeList");
  if (!title || !list) return;

  var tab = TABS.find(t => t.id === activeTab);
  if (!tab) { list.innerHTML = ""; return; }

  title.textContent = tab.name;
  if (count) count.textContent = (tab.data ? tab.data.length : 0) + " items";
  list.innerHTML = "";

  if (tab.type === "shape") {
    tab.data.forEach(item => {
      var div = document.createElement("div");
      div.className = "shape-item" + (activeShape === item.id ? " active" : "");
      div.dataset.id = item.id;
      div.innerHTML = `<span class="icon" style="color:${item.color}">${item.icon}</span><span class="name">${item.name}</span>`
        + (item.star ? '<span class="badge-mini">CGL</span>' : '');
      div.onclick = function() { selectShape(item.id); };
      list.appendChild(div);
    });
  } else if (tab.type === "theorem") {
    tab.data.forEach(item => {
      var div = document.createElement("div");
      div.className = "shape-item" + (activeShape === item.id ? " active" : "");
      div.innerHTML = `<span class="icon" style="color:var(--amber);">★</span><span class="name">${item.name}</span>`;
      div.onclick = function() { selectTheorem(item.id); };
      list.appendChild(div);
    });
  }
}

function selectShape(shapeId) {
  var detail = SHAPE_DETAILS[shapeId] || {
    name: shapeId.replace(/-/g,' ').toUpperCase(), subtitle: "High-Yield CGL Reference", icon: "○", color: "#22d3ee",
    difficulty: "easy", overview: "Detailed geometry parameters for " + shapeId, properties: ["Standard geometric properties apply"], variables: [], formulas: [], calc: {}
  };
  activeShape = shapeId;
  renderSidebar();
  renderShapePage(shapeId, detail);
}

function selectTheorem(theoremId) {
  activeShape = theoremId;
  renderSidebar();
  var t = THEOREMS.find(e => e.id === theoremId);
  var main = document.getElementById("mainContent");
  if (!main || !t) return;
  main.innerHTML = `
    <div class="card-eyebrow" style="color:var(--amber);"><i class="fa-solid fa-graduation-cap"></i> Theorem</div>
    <h1 class="card-title" style="color:var(--amber);">${t.name}</h1>
    <div class="note-card" style="font-size:14px; line-height:1.7; margin-top:16px;">${t.content}</div>
  `;
}

// ====================
// SHAPE PAGE RENDERER
// ====================

function renderShapePage(shapeId, detail) {
  var main = document.getElementById("mainContent");
  if (!main) return;

  var is3D = (shapeId === "cone" || shapeId === "cylinder" || shapeId === "sphere" || shapeId === "frustum" || shapeId === "cube");

  var html = `
    <div class="card-header-bar">
      <div>
        <div class="card-eyebrow" style="color:${detail.color}">
          <i class="fa-solid fa-shapes"></i> ${detail.name}
        </div>
        <h1 class="card-title">${detail.name}</h1>
        <div class="card-sub">${detail.subtitle}</div>
      </div>
      <span class="badge ${detail.difficulty}">${detail.difficulty}</span>
    </div>

    <!-- DYNAMIC SVG DIAGRAM & 3D CUT TOGGLE -->
    <div class="diagram-container">
      ${is3D ? `
        <div class="slice-bar">
          <button class="slice-btn active" onclick="setSliceMode('${shapeId}', 'default')"><i class="fa-solid fa-cube"></i> 3D View</button>
          <button class="slice-btn" onclick="setSliceMode('${shapeId}', 'slice-vert')"><i class="fa-solid fa-scissors"></i> Vertical Cut</button>
          <button class="slice-btn" onclick="setSliceMode('${shapeId}', 'slice-horiz')"><i class="fa-solid fa-layer-group"></i> Horizontal Cut</button>
        </div>
      ` : ''}
      <div class="diagram-box" id="diagramBox">
        ${renderShapeSVG(shapeId, {}, currentSliceMode)}
      </div>
    </div>

    <!-- OVERVIEW -->
    <div class="section-h"><i class="fa-solid fa-circle-info"></i> Overview &amp; Definition</div>
    <p style="font-size:14px; line-height:1.7; color:var(--text-dim); margin-bottom:12px;">${detail.overview}</p>

    <!-- KEY FACTS / PROPERTIES -->
    ${detail.properties && detail.properties.length ? `
      <div class="section-h"><i class="fa-solid fa-list-check"></i> Key Facts — Short &amp; Memorable</div>
      <div class="props-grid">
        ${detail.properties.map(p => `<div class="prop-item">${p}</div>`).join('')}
      </div>
    ` : ''}

    <!-- VARIABLES / SYMBOLS -->
    ${detail.variables && detail.variables.length ? `
      <div class="section-h"><i class="fa-solid fa-font"></i> Symbols Used</div>
      <div class="info-grid">
        ${detail.variables.map(v => `<div class="info-cell"><label>${v.symbol}</label><div class="val">${v.name}</div>${v.desc ? `<div class="desc">${v.desc}</div>` : ''}</div>`).join('')}
      </div>
    ` : ''}

    <!-- FORMULA REFERENCE -->
    ${detail.formulas && detail.formulas.length ? `
      <div class="section-h"><i class="fa-solid fa-calculator"></i> Formulas</div>
      <table class="formula-table">
        <thead><tr><th>Quantity</th><th>Formula</th><th>Example</th></tr></thead>
        <tbody>
          ${detail.formulas.map(f => `
            <tr>
              <td style="font-weight:700;">${f.quantity}</td>
              <td class="formula">${f.formula}</td>
              <td class="var">${f.example || "—"}</td>
            </tr>
          `).join('')}
        </tbody>
      </table>
    ` : ''}

    <!-- LIVE CALCULATOR -->
    ${detail.calc && Object.keys(detail.calc).length ? `
      <div class="section-h"><i class="fa-solid fa-sliders"></i> Interactive Live Calculator</div>
      <div class="calculator">
        <div class="calc-formula">${detail.name} <span class="var">Live Calculator</span></div>
        <div class="calc-grid">
          ${Object.keys(detail.calc).map(key => {
            var f = detail.calc[key];
            if (f.formula || f.calc) {
              return `<div class="calc-field"><label>${f.label}</label><input type="number" id="calc-${key}" readonly style="background:rgba(255,255,255,0.02); color:var(--accent);"></div>`;
            } else {
              return `<div class="calc-field"><label>${f.label}</label><input type="number" id="calc-${key}" min="0" step="any" placeholder="Enter value"></div>`;
            }
          }).join('')}
        </div>
        <div class="calc-result">
          <div class="label">Calculated Result</div>
          <div class="value" id="calcResultDisplay">Enter values above</div>
        </div>
      </div>
    ` : ''}

    <!-- RELATED CONCEPTS (deep dive — everything else tied to this shape) -->
    ${detail.relatedIds && detail.relatedIds.length ? `
      <div class="section-h"><i class="fa-solid fa-diagram-project"></i> Related Concepts — Everything Else About ${detail.name}</div>
      <div class="related-accordion" id="relatedAccordion">
        ${detail.relatedIds.map((rid, i) => {
          var rd = SHAPE_DETAILS[rid];
          if (!rd) return '';
          return `
          <div class="acc-item" id="acc-${rid}">
            <div class="acc-head" onclick="toggleAccordion('${rid}')">
              <span class="acc-icon" style="color:${rd.color}">${rd.icon}</span>
              <span class="acc-title">${rd.name}</span>
              <span class="acc-sub">${rd.subtitle}</span>
              <i class="fa-solid fa-chevron-down acc-chev"></i>
            </div>
            <div class="acc-body">
              <div class="acc-diagram">${renderShapeSVG(rid, {}, 'default')}</div>
              <p style="font-size:13px; line-height:1.65; color:var(--text-dim); margin:10px 0;">${rd.overview}</p>
              ${rd.properties && rd.properties.length ? `
                <div class="props-grid" style="margin-bottom:10px;">
                  ${rd.properties.map(p => `<div class="prop-item" style="font-size:11.5px;">${p}</div>`).join('')}
                </div>` : ''}
              ${rd.formulas && rd.formulas.length ? `
                <table class="formula-table">
                  <thead><tr><th>Quantity</th><th>Formula</th><th>Example</th></tr></thead>
                  <tbody>${rd.formulas.map(f => `<tr><td style="font-weight:700;">${f.quantity}</td><td class="formula">${f.formula}</td><td class="var">${f.example||"—"}</td></tr>`).join('')}</tbody>
                </table>` : ''}
            </div>
          </div>`;
        }).join('')}
      </div>
    ` : ''}
  `;

  main.innerHTML = html;
  setupCalculator(shapeId, detail);
}

window.toggleAccordion = function(rid) {
  var item = document.getElementById("acc-" + rid);
  if (item) item.classList.toggle("open");
};

window.setSliceMode = function(shapeId, mode) {
  currentSliceMode = mode;
  var btns = document.querySelectorAll(".slice-btn");
  btns.forEach(b => b.classList.remove("active"));

  var box = document.getElementById("diagramBox");
  if (box) box.innerHTML = renderShapeSVG(shapeId, {}, mode);
};

function setupCalculator(shapeId, detail) {
  var calc = detail.calc;
  if (!calc) return;
  Object.keys(calc).forEach(key => {
    var el = document.getElementById("calc-" + key);
    if (!el) return;
    if (!calc[key].formula && !calc[key].calc) {
      el.addEventListener("input", function() {
        computeCalculator(shapeId, detail, calc);
      });
    }
  });
}

function computeCalculator(shapeId, detail, calc) {
  var inputs = {};
  Object.keys(calc).forEach(k => {
    var el = document.getElementById("calc-" + k);
    inputs[k] = el ? (parseFloat(el.value) || 0) : 0;
  });

  var box = document.getElementById("diagramBox");
  if (box) box.innerHTML = renderShapeSVG(shapeId, inputs, currentSliceMode);

  var resultLines = [];
  Object.keys(calc).forEach(k => {
    var f = calc[k];
    var expr = f.calc || f.formula;
    if (expr) {
      var val = evalExpr(expr, inputs);
      var el = document.getElementById("calc-" + k);
      if (el) el.value = formatResult(val);
      if (f.formula) resultLines.push(f.label + ": <b style=\"color:var(--accent)\">" + formatResult(val) + "</b>");
    }
  });

  var display = document.getElementById("calcResultDisplay");
  if (display) {
    display.innerHTML = resultLines.length ? resultLines.join("<br>") : "Enter values above";
  }
}

function evalExpr(expr, vars) {
  try {
    var fn = new Function(...Object.keys(vars), "return " + expr + ";");
    return fn(...Object.values(vars));
  } catch (err) { return NaN; }
}

function formatResult(n) {
  if (isNaN(n) || n === null || n === undefined) return "—";
  return Math.round(n * 100) / 100;
}

function switchTab(tabId) {
  activeTab = tabId;
  activeShape = null;

  var tabs = document.querySelectorAll(".nav-tab");
  tabs.forEach(t => t.classList.toggle("active", t.dataset.tab === tabId));

  var tab = TABS.find(t => t.id === tabId);
  if (tab && tab.data && tab.data.length) {
    if (tab.type === "theorem") {
      selectTheorem(tab.data[0].id);
    } else {
      selectShape(tab.data[0].id);
    }
  }
  renderSidebar();
}

// Search
var searchInput = document.getElementById("searchInput");
var searchResults = document.getElementById("searchResults");
if (searchInput) {
  searchInput.addEventListener("input", function() {
    var q = searchInput.value.trim().toLowerCase();
    if (!q) { searchResults.classList.remove("show"); return; }
    var matches = SEARCH_INDEX.filter(i => i.label.toLowerCase().includes(q)).slice(0, 8);
    searchResults.innerHTML = matches.map((m, i) => `
      <div class="search-item" onclick="switchTab('${m.category}'); ${m.type === 'theorem' ? `selectTheorem('${m.id}')` : `selectShape('${m.id}')`};"><b>${m.label}</b><br><span style="font-size:10px; color:var(--text-faint);">${m.sub}</span></div>
    `).join('');
    searchResults.classList.add("show");
  });
}

document.getElementById("resetBtn").onclick = function() { switchTab(activeTab); };
document.querySelectorAll(".nav-tab").forEach(tab => {
  tab.addEventListener("click", function() { switchTab(tab.dataset.tab); });
});

var closeBtn = document.getElementById("atlasCloseBtn");
if (closeBtn) {
  closeBtn.addEventListener("click", function() {
    window.parent.postMessage({ type: "closeFullscreen" }, "*");
  });
}

document.addEventListener("keydown", function(e) {
  if (e.key === "b" || e.key === "B") {
    window.parent.postMessage({ type: "closeFullscreen" }, "*");
  }
});

window.selectShape = selectShape;
window.switchTab = switchTab;
switchTab("2d");

})();
</script>
</body>
</html>
